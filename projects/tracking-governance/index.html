    <style>
        .custom-scrollbar::-webkit-scrollbar {

        }

            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        /* Viewer Topbar (Padrão GitHub Pages Aqui Ads) */
        .demo-bar {

            padding: 8px 20px;

            align-items: center;
            font-size: 12px;
            color: #cbd5e1;
            z-index: 2000;
        }
        .demo-bar-links {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .demo-bar-btn {
            text-decoration: none;
            color: #ffffff;
            font-weight: 700;
            background: #2563eb;
            padding: 5px 12px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            transition: background 0.15s ease;

        .demo-bar-btn:hover {
            background: #1d4ed8;
        }
        .demo-bar-back {
            text-decoration: none;
            color: #94a3b8;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: color 0.15s ease;

<body class="bg-gray-50 text-aqui-blue font-sans antialiased min-h-screen">
