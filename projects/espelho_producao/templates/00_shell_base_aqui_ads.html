<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aqui Ads - Shell Base Oficial (Para Telas Ineditas)</title>

  <!-- Dependências Base e Kit Oficial Compilado (smb-web) -->
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="aqui_ads_official.css">

  <!-- ===================================================================== -->
  <!-- CONFIGURAÇÃO DECLARATIVA DO TEMPLATE / PROTÓTIPO                      -->
  <!-- ===================================================================== -->
  <script>
    /**
     * Template: 00_shell_base_aqui_ads.html
     * Descrição: Shell limpo contendo Header Oficial, Menu Lateral, Alternador Desktop/Mobile 390px, Rodape Globo e Modais para construcao de telas 100% novas.
     *
     * Para criar um protótipo a partir deste template:
     * 1. Copie este arquivo junto com aqui_ads_official.css, aqui_ads_mock_data.js e aqui_ads_ui.js
     * 2. Use window.AQUI_ADS_CONFIG.hooks para customizar cards, banners, modais ou barras
     *    sem precisar duplicar as 6.400 linhas da plataforma!
     */
    window.AQUI_ADS_CONFIG = {
      initialScreen: 'view-resultados',
      initialChannel: 'ooh',
      initialTab: 'planos',
      cartPreset: 'empty',
      shellOnly: true,

      hooks: {
        // Exemplos de Hooks de Extensão (descomente o que precisar no seu protótipo):
        //
        // beforeResultsContent(api) {
        //   return ''; // Injeta banner/filtro no topo da Página de Resultados
        // },
        //
        // renderOohCard(point, ctx, defaultRender) {
        //   return defaultRender(point); // Customiza o card de ponto OOH
        // },
        //
        // renderDigitalCard(prod, ctx, defaultRender) {
        //   return defaultRender(prod); // Customiza o card de produto Digital | Globo
        // },
        //
        // renderBottomBar(ctx, defaultRender) {
        //   return defaultRender(); // Customiza a barra inferior fixa (sticky bar)
        // },
        //
        // afterResumoContent(ctx) {
        //   return ''; // Injeta componente extra (ex.: carrossel de upsell) no Resumo do Plano
        // },
        //
        // onReady(api) {
        //   // Executado assim que o DOM oficial e os catálogos estiverem montados
        // }
      }
    };
  </script>

  <!-- Banco de Dados Mockado Central e Motor Modular de UI -->
  <script src="aqui_ads_mock_data.js"></script>
  <script src="aqui_ads_ui.js"></script>
</head>
<body class="bg-white text-gray-900 antialiased min-h-screen flex flex-col">
  <!-- ===================================================================== -->
  <!-- SLOT PARA TELAS INÉDITAS (Renderizado dentro do Shell Oficial)        -->
  <!-- ===================================================================== -->
  <div id="custom-prototype-root">
    <div class="max-w-[1220px] mx-auto px-4 sm:px-6 lg:px-10 py-10">
      <div class="bg-white border border-[#DFE7EF] rounded-2xl p-8 shadow-xs">
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-[11px] font-bold bg-orange-50 text-[#FF4F00] mb-3">
          Shell Base Oficial • Aqui Ads (smb-web)
        </span>
        <h1 class="text-2xl font-extrabold text-[#282E38] mb-2">Sua Nova Tela ou Fluxo Começa Aqui</h1>
        <p class="text-sm text-[#64748B] max-w-2xl leading-relaxed mb-6">
          Este template carrega automaticamente o Header Oficial do Aqui Ads, o Menu Lateral, o Alternador Desktop / Mobile (390px), o Rodapé Globo, o sistema de Toasts (<code>showToast()</code>) e os dados mockados (<code>window.AQUI_ADS_MOCK_DATA</code>).
        </p>
        <div class="flex flex-wrap items-center gap-3">
          <button type="button" onclick="showToast('Interação validada no Shell Oficial!')" class="px-5 py-2.5 rounded-lg bg-[#FF4F00] hover:bg-[#E54700] text-white text-xs font-bold cursor-pointer transition shadow-xs">
            Testar Toast Oficial
          </button>
        </div>
      </div>
    </div>
  </div>
  <!-- O Shell Oficial do Aqui Ads e as telas da jornada são montados automaticamente por aqui_ads_ui.js -->
</body>
</html>
