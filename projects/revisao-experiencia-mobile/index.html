<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aqui Ads — Revisão da Experiência Mobile (7 Quick Wins Mobile-First)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="aqui_ads_official.css" />
  <style>
    header.header-shrunk {
      padding-top: 4px !important;
      padding-bottom: 4px !important;
      transition: all 0.2s ease;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="aqui-ads-shell-root"></div>

  <script src="aqui_ads_mock_data.js"></script>
  <script src="aqui_ads_ui.js"></script>
  <script>
    function applyMobileQuickWins() {
      const topControls = document.querySelector('#aqui-ads-shell-root > header > div');
      if (topControls) {
        const bar = document.createElement('div');
        bar.className = 'flex items-center gap-2 text-xs';
        bar.innerHTML = `
          <span class="px-2.5 py-1 rounded-md bg-orange-500/20 text-orange-300 border border-orange-500/30 font-semibold hidden xl:inline-block">
            7 Quick Wins Mobile-First: Header Compacto • Teclado Nativo • Carrossel Fade • Touch 44px • Barra Sticky • Nome/Rascunho no Topo
          </span>
          <a href="quick-wins-mobile.html" class="px-2.5 py-1 rounded-md bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-200 border border-emerald-400/30 font-semibold flex items-center gap-1.5 transition-colors">
            <span>📱</span><span>Comparativo Antes vs. Depois</span>
          </a>
          <a href="https://www.notion.so/3229587e413781f9b036c0f82c12c1b0" target="_blank" rel="noopener noreferrer" class="px-2.5 py-1 rounded-md bg-indigo-500/20 hover:bg-indigo-500/30 text-indigo-200 border border-indigo-400/30 font-semibold flex items-center gap-1.5 transition-colors">
            <span>📄</span><span>Doc Notion</span>
          </a>
        `;
        topControls.insertBefore(bar, topControls.firstChild);
      }

      // QW 1: Shrinking Sticky Header on Scroll
      const vp = document.getElementById('viewport-container');
      const hdr = document.querySelector('#viewport-container header');
      if (vp && hdr) {
        vp.addEventListener('scroll', () => {
          hdr.classList.toggle('header-shrunk', vp.scrollTop > 40);
        });
      }
      window.addEventListener('scroll', () => {
        if (hdr) hdr.classList.toggle('header-shrunk', window.scrollY > 40);
      });

      // QW 2: Native Mobile Inputs (type="search" enterkeyhint="search" + native date/duration)
      const searchInput = document.getElementById('plp-search-address');
      if (searchInput) {
        searchInput.setAttribute('type', 'search');
        searchInput.setAttribute('enterkeyhint', 'search');
        searchInput.setAttribute('inputmode', 'search');
      }

      // QW 3: Filter Pills Carousel with horizontal scroll & right fade indicator
      const firstChip = document.querySelector('.ooh-cat-chip');
      if (firstChip && firstChip.parentElement) {
        const chipRow = firstChip.parentElement;
        chipRow.id = 'filter-pills-carousel';
        chipRow.classList.add('overflow-x-auto', 'whitespace-nowrap', 'no-scrollbar', 'pr-8');
      }

      // QW 6: Campaign Name + 0/30 Counter + Full-width Save Draft Button at the top of Resumo Mobile
      const viewResumoContainer = document.querySelector('#view-resumo > div');
      if (viewResumoContainer) {
        const qw6Card = document.createElement('div');
        qw6Card.className = 'bg-white rounded-xl border border-[#E2E8F0] p-4 shadow-xs space-y-3 mb-5';
        qw6Card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-1">
              <label for="campaign-name-input" class="text-xs font-bold text-[#282E38]">Nome da campanha</label>
              <span id="char-counter" class="text-[11px] font-semibold text-[#64748B]">19/30 caracteres</span>
            </div>
            <input id="campaign-name-input" type="text" maxlength="30" value="Campanha Outubro 26" oninput="document.getElementById('char-counter').textContent = this.value.length + '/30 caracteres'; const rInput = document.getElementById('resumo-camp-name'); if (rInput) { rInput.value = this.value; updateResumoCampCount(); }" class="w-full rounded-lg border border-[#CBD5E1] px-3 py-2 text-xs font-semibold text-[#282E38] focus:border-[#FF4F00] outline-none" placeholder="Digite o nome da sua campanha" />
          </div>
          <button type="button" onclick="openSaveDraftModal()" class="w-full py-2.5 px-4 rounded-lg border border-[#CBD5E1] bg-[#F8FAFC] hover:bg-gray-100 text-xs font-bold text-[#282E38] flex items-center justify-center gap-2 cursor-pointer transition min-h-[44px]">
            <span>💾</span><span>salvar como rascunho</span>
          </button>
        `;
        const gridEl = viewResumoContainer.querySelector('.grid');
        if (gridEl) {
          viewResumoContainer.insertBefore(qw6Card, gridEl);
        }
      }

      // QW 5: Sticky Bottom Bar in Resumo Mobile
      const resumoTotalEl = document.getElementById('resumo-val-total');
      if (resumoTotalEl) {
        const rightCard = resumoTotalEl.closest('.bg-white');
        if (rightCard) {
          const stickyBar = document.createElement('div');
          stickyBar.id = 'qw5-sticky-resumo-bar';
          stickyBar.className = 'sticky bottom-0 z-30 mt-4 -mx-4 px-4 py-3 bg-white border-t border-gray-200 shadow-[0_-4px_12px_rgba(0,0,0,0.06)] flex items-center justify-between gap-3';
          stickyBar.innerHTML = `
            <div>
              <span class="block text-[10px] uppercase font-bold text-[#64748B]">Valor Total</span>
              <strong id="qw5-sticky-total" class="text-sm font-extrabold text-[#282E38]">${resumoTotalEl.textContent || 'R$ 7.106,16'}</strong>
            </div>
            <button type="button" onclick="goToPagamento()" class="px-5 py-2.5 rounded-lg bg-[#FF4F00] hover:bg-[#E04600] text-white text-xs font-bold cursor-pointer transition shadow-xs min-h-[44px]">
              Realizar Pagamento →
            </button>
          `;
          rightCard.appendChild(stickyBar);
        }
      }

      const origPopulateResumo = window.populateResumoScreen;
      if (typeof origPopulateResumo === 'function') {
        window.populateResumoScreen = function() {
          origPopulateResumo();
          const t = document.getElementById('resumo-val-total');
          const qwTotal = document.getElementById('qw5-sticky-total');
          if (t && qwTotal) qwTotal.textContent = t.textContent;
        };
        window.populateResumoScreen();
      }
    }

    AquiAdsUI.mount('#aqui-ads-shell-root', {
      title: 'Revisão da Experiência Mobile (7 Quick Wins Mobile-First)',
      initialView: 'resultados',
      initialChannel: 'ooh',
      cartPreset: 'midiaMista',
      viewport: 'mobile',
      onReady: applyMobileQuickWins
    });
  </script>
</body>
</html>
