<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aqui Ads | Protótipo — Upsell OOH no Resumo do Plano</title>
  <link rel="icon" type="image/svg+xml" href="https://aquiads.com.br/favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="aqui_ads_official.css" />
  <style>
    #resumo-accordion-digital,
    #resumo-accordion-radio,
    #resumo-accordion-tv,
    #resumo-accordion-combos {
      display: none !important;
    }
  </style>
  <script>
    window.AQUI_ADS_MANUAL_MOUNT = false;
    window.AQUI_ADS_CONFIG = {
      initialScreen: 'view-resumo',
      cartPreset: 'ooh_only',
      hooks: {
        afterResumoContent: function() {
          if (typeof window.renderUpsellViews === 'function') {
            window.renderUpsellViews();
          }
          return '';
        },
        onReady: function() {
          if (typeof window.setupUpsellPrototype === 'function') {
            window.setupUpsellPrototype();
          }
        }
      }
    };
  </script>
  <script src="aqui_ads_mock_data.js?v=10"></script>
  <script src="aqui_ads_ui.js?v=10"></script>
</head>
<body class="bg-gray-100">

  <!-- MODAL POSICIONAMENTO 3 -->
  <div id="modal-sugestao3" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/55 backdrop-blur-[2px] p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-[620px] w-full overflow-hidden border border-[#E2E8F0]">
      <div class="bg-white px-6 py-4 border-b border-[#E2E8F0] flex items-center justify-between gap-3">
        <div class="flex items-center gap-2.5">
          <div class="w-7 h-7 rounded-lg bg-[#FF4F00]/10 text-[#FF4F00] flex items-center justify-center shrink-0">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a2 2 0 01-2.828 0l-4.243-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          </div>
          <h3 class="text-sm font-bold text-[#282E38]">Outros pontos na mesma região</h3>
        </div>
        <button type="button" onclick="closeModalSugestao3()" class="w-7 h-7 rounded-full bg-white border border-gray-200 text-gray-400 hover:text-gray-600 flex items-center justify-center cursor-pointer transition">
          ✕
        </button>
      </div>
      <div class="p-5 bg-[#F8FAFC]">
        <div id="upsell-container-modal" class="space-y-2.5"></div>
      </div>
      <div class="px-6 py-3.5 bg-white border-t border-[#E2E8F0] flex flex-col sm:flex-row items-center justify-between gap-3">
        <div>
          <span class="block text-[11px] text-[#64748B]">Total do plano:</span>
          <strong id="modal-sug3-total" class="text-sm font-extrabold text-[#282E38]">R$ 529,92</strong>
        </div>
        <div class="flex items-center gap-2.5 w-full sm:w-auto justify-end">
          <button type="button" onclick="proceedToPaymentDirect()" class="px-3.5 py-2 rounded-lg border border-[#E2E8F0] bg-white hover:bg-gray-50 text-[#282E38] text-xs font-bold transition cursor-pointer">
            Continuar sem adicionar
          </button>
          <button type="button" onclick="proceedToPaymentDirect()" class="px-4 py-2 rounded-lg bg-[#FF4F00] hover:bg-[#E04500] text-white text-xs font-bold transition shadow-xs cursor-pointer inline-flex items-center gap-1.5">
            <span>realizar pagamento</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    window.activeUpsellVariant = 'sugestao1';
    window.SUGGESTED_UPSELL_ITEMS = [
      {
        id: 'sug-1',
        name: 'Edifício Berrini Plaza',
        address: 'R. Funchal, 418 – Vila Olímpia, São Paulo, SP',
        environment: 'residencial',
        format: 'digital',
        basePrice2w: 264.96,
        price2w: 264.96,
        price4w: 489.98,
        impressions: 12800,
        reach: 1150,
        screens: 2,
        freq: 11.1
      },
      {
        id: 'sug-2',
        name: 'Morumbi Prime Center',
        address: 'Av. Roque Petroni Jr, 850 – Brooklin, SP',
        environment: 'comercial',
        format: 'digital',
        basePrice2w: 264.96,
        price2w: 264.96,
        price4w: 489.98,
        impressions: 14500,
        reach: 1310,
        screens: 2,
        freq: 11.1
      },
      {
        id: 'sug-3',
        name: 'Condomínio Itaim Life',
        address: 'R. Joaquim Floriano, 720 – Itaim Bibi, SP',
        environment: 'residencial',
        format: 'digital',
        basePrice2w: 264.96,
        price2w: 264.96,
        price4w: 489.98,
        impressions: 9900,
        reach: 890,
        screens: 1,
        freq: 11.1
      }
    ];

    function getActiveCartState() {
      if (window.cartState) return window.cartState;
      try {
        if (window.AquiAdsUI && typeof window.AquiAdsUI.getState === 'function') {
          return window.AquiAdsUI.getState().cartState;
        }
      } catch (e) {}
      return null;
    }

    function formatBRLCurrency(num) {
      return 'R$ ' + Number(num || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function isUpsellAdded(itemId) {
      var cs = getActiveCartState();
      return cs && cs.oohItems && cs.oohItems.some(function(i) { return i.id === itemId; });
    }

    window.toggleSuggestedUpsellItem = function(itemId) {
      var item = window.SUGGESTED_UPSELL_ITEMS.find(function(x) { return x.id === itemId; });
      var cs = getActiveCartState();
      if (!item || !cs) return;
      var idx = cs.oohItems.findIndex(function(i) { return i.id === itemId; });
      if (idx >= 0) {
        cs.oohItems.splice(idx, 1);
        if (typeof window.showToast === 'function') {
          window.showToast('"' + item.name + '" removido do plano de mídia.');
        }
      } else {
        cs.oohItems.push(Object.assign({}, item, { selectedForBatch: false }));
        if (typeof window.showToast === 'function') {
          window.showToast('"' + item.name + '" adicionado ao plano de mídia!');
        }
      }
      if (typeof window.populateResumoScreen === 'function') window.populateResumoScreen();
    };
    window.toggleSuggestedItem = window.toggleSuggestedUpsellItem;

    window.resetCartState = function() {
      var cs = getActiveCartState();
      if (window.AquiAdsUI && typeof window.AquiAdsUI.setCartPreset === 'function') {
        window.AquiAdsUI.setCartPreset('ooh_only', true);
      }
      cs = getActiveCartState();
      if (cs) {
        cs.digitalItems = [];
        cs.durationDays = 14;
        cs.startDate = '03/11/2026';
        cs.endDate = '17/11/2026';
      }
      if (typeof window.populateResumoScreen === 'function') window.populateResumoScreen();
      if (typeof window.showToast === 'function') window.showToast('Estado do plano resetado para a configuração inicial (somente OOH).');
    };

    function renderDsTagsHtml(imp, envLabel, fmtLabel) {
      return '<div class="flex items-center gap-1.5 flex-wrap">' +
        '<span class="bg-[#94A3B8] text-white text-[10px] font-semibold px-2 py-0.5 rounded-sm inline-flex items-center gap-1">👁 ' + imp.toLocaleString('pt-BR') + '</span>' +
        '<span class="bg-[#E2E8F0] text-[#282E38] text-[10px] font-semibold px-2 py-0.5 rounded-sm inline-flex items-center gap-1">🏢 ' + envLabel + '</span>' +
        '<span class="bg-[#3F1195] text-white text-[10px] font-semibold px-2 py-0.5 rounded-sm inline-flex items-center gap-1">🖥 ' + fmtLabel + '</span>' +
      '</div>';
    }

    window.renderUpsellViews = function() {
      if (typeof window.ensureUpsellDOM === 'function') {
        window.ensureUpsellDOM();
      }
      var cs = getActiveCartState();
      var inlineEl = document.getElementById('upsell-container-inline');
      var sidebarEl = document.getElementById('upsell-container-sidebar');
      var modalEl = document.getElementById('upsell-container-modal');
      var is4w = cs && cs.durationDays === 28;
      var mult = is4w ? 1.85 : 1;
      var periodLabel = is4w ? '4 semanas' : '2 semanas';

      var sectionHeaderHtml =
        '<div class="flex items-center gap-2">' +
          '<span class="w-6 h-6 rounded-lg bg-[#FF4F00]/10 text-[#FF4F00] flex items-center justify-center shrink-0">' +
            '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a2 2 0 01-2.828 0l-4.243-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>' +
          '</span>' +
          '<h4 class="text-xs font-bold text-[#282E38]">Outros pontos na mesma região</h4>' +
        '</div>';

      // Posicionamento 1: Bloco destacado na coluna esquerda com grid de 3 cards brancos no DS
      if (inlineEl) {
        inlineEl.classList.toggle('hidden', window.activeUpsellVariant !== 'sugestao1');
        var inlineCardsHtml = window.SUGGESTED_UPSELL_ITEMS.map(function(u) {
          var added = isUpsellAdded(u.id);
          var price = u.basePrice2w * mult;
          var imp = Math.round(u.impressions * (is4w ? 2 : 1));
          var envLabel = (u.environment || 'residencial').toLowerCase();
          var fmtLabel = (u.format || 'digital').toLowerCase();

          return '<div class="rounded-xl border p-3.5 flex flex-col justify-between transition-all bg-white shadow-2xs ' +
            (added ? 'border-[#10B981]' : 'border-[#E2E8F0] hover:border-[#CBD5E1]') + '">' +
            '<div>' +
              '<h5 class="text-xs font-bold text-[#282E38] truncate" title="' + u.name + '">' + u.name + '</h5>' +
              '<p class="text-[11px] text-[#64748B] line-clamp-2 mt-1 min-h-[32px]">' + u.address + '</p>' +
              '<div class="mt-2.5">' + renderDsTagsHtml(imp, envLabel, fmtLabel) + '</div>' +
            '</div>' +
            '<div class="mt-3 pt-2.5 border-t border-gray-100 flex flex-col gap-2">' +
              '<div class="flex items-baseline justify-between">' +
                '<strong class="text-xs font-extrabold text-[#282E38]">' + formatBRLCurrency(price) + '</strong>' +
                '<span class="text-[11px] text-[#64748B]">/ ' + periodLabel + '</span>' +
              '</div>' +
              '<button type="button" onclick="toggleSuggestedUpsellItem(\'' + u.id + '\')" class="w-full py-1.5 px-2.5 rounded-lg text-[11px] font-bold transition cursor-pointer flex items-center justify-center gap-1 ' +
                (added ? 'bg-[#ECFDF5] border border-[#10B981] text-[#047857] hover:bg-[#D1FAE5]' : 'bg-white border border-[#FF4F00] text-[#FF4F00] hover:bg-[#FF4F00] hover:text-white') + '">' +
                (added ? '✓ adicionado' : '+ adicionar') +
              '</button>' +
            '</div>' +
          '</div>';
        }).join('');

        inlineEl.innerHTML =
          '<div class="mt-4 rounded-xl border border-[#E2E8F0] bg-[#F8FAFC] p-4 space-y-3">' +
            sectionHeaderHtml +
            '<div class="grid grid-cols-1 md:grid-cols-3 gap-3">' + inlineCardsHtml + '</div>' +
          '</div>';
      }

      // Posicionamento 2: Bloco destacado na coluna direita com 3 cards empilhados no DS
      if (sidebarEl) {
        sidebarEl.classList.toggle('hidden', window.activeUpsellVariant !== 'sugestao2');
        var sidebarCardsHtml = window.SUGGESTED_UPSELL_ITEMS.map(function(u) {
          var added = isUpsellAdded(u.id);
          var price = u.basePrice2w * mult;
          var imp = Math.round(u.impressions * (is4w ? 2 : 1));
          var envLabel = (u.environment || 'residencial').toLowerCase();
          var fmtLabel = (u.format || 'digital').toLowerCase();

          return '<div class="rounded-xl border p-3 bg-white shadow-2xs transition-all ' +
            (added ? 'border-[#10B981]' : 'border-[#E2E8F0]') + '">' +
            '<div class="flex items-start justify-between gap-2">' +
              '<div class="min-w-0">' +
                '<h5 class="text-xs font-bold text-[#282E38] truncate">' + u.name + '</h5>' +
                '<p class="text-[11px] text-[#64748B] truncate mt-0.5">' + u.address + '</p>' +
              '</div>' +
              '<button type="button" onclick="toggleSuggestedUpsellItem(\'' + u.id + '\')" class="shrink-0 px-2.5 py-1 rounded-lg text-[11px] font-bold transition cursor-pointer ' +
                (added ? 'bg-[#ECFDF5] border border-[#10B981] text-[#047857]' : 'bg-white border border-[#FF4F00] text-[#FF4F00] hover:bg-[#FF4F00] hover:text-white') + '">' +
                (added ? '✓ adicionado' : '+ adicionar') +
              '</button>' +
            '</div>' +
            '<div class="mt-2.5 flex items-center justify-between gap-2 flex-wrap">' +
              renderDsTagsHtml(imp, envLabel, fmtLabel) +
              '<div class="shrink-0">' +
                '<strong class="text-xs font-extrabold text-[#282E38]">' + formatBRLCurrency(price) + '</strong>' +
                '<span class="text-[11px] text-[#64748B]">/ ' + periodLabel + '</span>' +
              '</div>' +
            '</div>' +
          '</div>';
        }).join('');

        sidebarEl.innerHTML =
          '<div class="my-4 rounded-xl border border-[#E2E8F0] bg-[#F8FAFC] p-3.5 space-y-2.5">' +
            sectionHeaderHtml +
            '<div class="space-y-2.5">' + sidebarCardsHtml + '</div>' +
          '</div>';
      }

      // Posicionamento 3: Cards brancos no DS dentro do Modal
      if (modalEl) {
        modalEl.innerHTML = window.SUGGESTED_UPSELL_ITEMS.map(function(u) {
          var added = isUpsellAdded(u.id);
          var price = u.basePrice2w * mult;
          var imp = Math.round(u.impressions * (is4w ? 2 : 1));
          var envLabel = (u.environment || 'residencial').toLowerCase();
          var fmtLabel = (u.format || 'digital').toLowerCase();

          return '<div class="rounded-xl border p-3.5 bg-white shadow-2xs transition-all ' +
            (added ? 'border-[#10B981]' : 'border-[#E2E8F0]') + '">' +
            '<div class="flex items-center justify-between gap-2 flex-wrap">' +
              '<span class="text-xs font-bold text-[#282E38]">' + u.name + '</span>' +
              '<div class="flex items-center gap-2">' +
                renderDsTagsHtml(imp, envLabel, fmtLabel) +
                '<button type="button" onclick="toggleSuggestedUpsellItem(\'' + u.id + '\')" class="px-3 py-1 rounded-lg text-[11px] font-bold transition cursor-pointer shrink-0 ' +
                  (added ? 'bg-[#ECFDF5] border border-[#10B981] text-[#047857]' : 'bg-white border border-[#FF4F00] text-[#FF4F00] hover:bg-[#FF4F00] hover:text-white') + '">' +
                  (added ? '✓ adicionado' : '+ adicionar') +
                '</button>' +
              '</div>' +
            '</div>' +
            '<div class="mt-2.5 flex items-baseline justify-between gap-4">' +
              '<span class="text-[11px] text-[#64748B]">' + u.address + '</span>' +
              '<div class="shrink-0">' +
                '<strong class="text-xs font-extrabold text-[#282E38]">' + formatBRLCurrency(price) + '</strong>' +
                '<span class="text-[11px] text-[#64748B]">/ ' + periodLabel + '</span>' +
              '</div>' +
            '</div>' +
          '</div>';
        }).join('');
        var totalEl = document.getElementById('modal-sug3-total');
        var resumoTotalEl = document.getElementById('resumo-val-total');
        if (totalEl && resumoTotalEl) totalEl.textContent = resumoTotalEl.textContent;
      }
    };

    window.setUpsellVariant = function(v) {
      window.activeUpsellVariant = v;
      ['sugestao1', 'sugestao2', 'sugestao3'].forEach(function(id) {
        var btn = document.getElementById('btn-var-' + id);
        if (!btn) return;
        if (id === v) {
          btn.className = 'px-3 py-1 rounded-md text-[11px] font-bold transition-all bg-[#FF4F00] text-white shadow-xs cursor-pointer';
        } else {
          btn.className = 'px-3 py-1 rounded-md text-[11px] font-semibold transition-all text-gray-300 hover:text-white cursor-pointer';
        }
      });
      if (typeof window.showScreen === 'function') window.showScreen('view-resumo');
      window.renderUpsellViews();
      if (v === 'sugestao3') {
        window.openModalSugestao3();
      } else {
        window.closeModalSugestao3();
      }
    };
    window.switchVariant = window.setUpsellVariant;

    window.openModalSugestao3 = function() {
      window.renderUpsellViews();
      var m = document.getElementById('modal-sugestao3');
      if (m) { m.classList.remove('hidden'); m.classList.add('flex'); m.style.display = 'flex'; }
    };

    window.closeModalSugestao3 = function() {
      var m = document.getElementById('modal-sugestao3');
      if (m) { m.classList.add('hidden'); m.classList.remove('flex'); m.style.display = ''; }
    };

    window.proceedToPaymentDirect = function() {
      window.closeModalSugestao3();
      if (typeof window.showScreen === 'function') window.showScreen('view-pagamento');
    };

    window.ensureUpsellDOM = function() {
      // Ocultar acordeões de outros canais no Resumo (deixar apenas OOH visível)
      ['resumo-accordion-digital', 'resumo-accordion-radio', 'resumo-accordion-tv', 'resumo-accordion-combos'].forEach(function(accId) {
        var el = document.getElementById(accId);
        if (el) el.classList.add('hidden');
      });
      var oohAcc = document.getElementById('resumo-accordion-ooh');
      if (oohAcc) oohAcc.classList.remove('hidden');

      // 1. Personalizar a barra escura de topo do protótipo
      var topBarInner = document.querySelector('#aqui-ads-shell-root > header > div');
      if (topBarInner && !document.getElementById('btn-var-sugestao1')) {
        var leftTitle = document.createElement('div');
        leftTitle.className = 'flex items-center gap-2.5';
        leftTitle.innerHTML =
          '<span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase tracking-wider bg-[#FF4F00]/20 text-[#FF6B2B] border border-[#FF4F00]/40">● PRODUCT OS</span>' +
          '<span class="text-xs text-gray-300 font-semibold hidden md:inline">Aqui Ads · Tela de Resumo (OOH)</span>';

        var centerControls = document.createElement('div');
        centerControls.className = 'flex items-center gap-2 flex-wrap';
        centerControls.innerHTML =
          '<span class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">POSICIONAMENTO:</span>' +
          '<div class="inline-flex bg-gray-900 rounded-lg p-0.5 border border-gray-800 gap-1">' +
            '<button id="btn-var-sugestao1" type="button" onclick="setUpsellVariant(\'sugestao1\')" class="px-3 py-1 rounded-md text-[11px] font-bold transition-all bg-[#FF4F00] text-white shadow-xs cursor-pointer">Posicionamento 1 (Lista OOH)</button>' +
            '<button id="btn-var-sugestao2" type="button" onclick="setUpsellVariant(\'sugestao2\')" class="px-3 py-1 rounded-md text-[11px] font-semibold transition-all text-gray-300 hover:text-white cursor-pointer">Posicionamento 2 (Coluna Direita)</button>' +
            '<button id="btn-var-sugestao3" type="button" onclick="setUpsellVariant(\'sugestao3\')" class="px-3 py-1 rounded-md text-[11px] font-semibold transition-all text-gray-300 hover:text-white cursor-pointer">Posicionamento 3 (Modal)</button>' +
          '</div>';

        var rightExtra = document.createElement('div');
        rightExtra.className = 'flex items-center gap-2';
        rightExtra.innerHTML =
          '<button type="button" onclick="resetCartState()" class="px-2.5 py-1 rounded-md text-[11px] font-semibold bg-gray-900 hover:bg-gray-800 text-gray-300 border border-gray-700 transition cursor-pointer">↺ Resetar Estado</button>' +
          '<a href="https://www.notion.so/4309587e41378137928de78a6a19272b" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-[11px] font-bold bg-white/10 hover:bg-white/20 text-white border border-white/15 transition">📄 Ver Doc no Notion</a>';

        var vpGroup = topBarInner.firstElementChild;
        topBarInner.innerHTML = '';
        topBarInner.appendChild(leftTitle);
        topBarInner.appendChild(centerControls);
        var rightWrapper = document.createElement('div');
        rightWrapper.className = 'flex items-center gap-2';
        rightWrapper.appendChild(rightExtra);
        if (vpGroup) rightWrapper.appendChild(vpGroup);
        topBarInner.appendChild(rightWrapper);
      }

      // 2. Injetar containers de pontos no Resumo (sem banners ou mensagens de sugestão)
      var oohAccBody = document.getElementById('resumo-acc-body-ooh');
      if (oohAccBody && !document.getElementById('upsell-container-inline')) {
        var inlineDiv = document.createElement('div');
        inlineDiv.id = 'upsell-container-inline';
        inlineDiv.className = (window.activeUpsellVariant && window.activeUpsellVariant !== 'sugestao1')
          ? 'hidden'
          : '';
        oohAccBody.appendChild(inlineDiv);
      }

      var sidebarCard = document.querySelector('#view-resumo .lg\\:col-span-5 > div');
      if (sidebarCard && !document.getElementById('upsell-container-sidebar')) {
        var sidebarDiv = document.createElement('div');
        sidebarDiv.id = 'upsell-container-sidebar';
        sidebarDiv.className = (window.activeUpsellVariant === 'sugestao2') ? '' : 'hidden';
        var hrs = sidebarCard.querySelectorAll('hr');
        var targetHr = hrs.length > 1 ? hrs[1] : hrs[0];
        if (targetHr) {
          sidebarCard.insertBefore(sidebarDiv, targetHr);
        } else {
          sidebarCard.appendChild(sidebarDiv);
        }
      }
    };

    window.setupUpsellPrototype = function() {
      var topBarInner = document.querySelector('#aqui-ads-shell-root > header > div');
      if (!topBarInner) return;

      window.ensureUpsellDOM();

      if (window.__upsellPrototypeInitialized) {
        window.renderUpsellViews();
        return;
      }
      window.__upsellPrototypeInitialized = true;

      // Garantir estado inicial 100% OOH (2 pontos, 2 semanas) sem outros produtos
      if (window.AquiAdsUI && typeof window.AquiAdsUI.setCartPreset === 'function') {
        window.AquiAdsUI.setCartPreset('ooh_only', true);
      }
      var cs = getActiveCartState();
      if (cs) {
        cs.digitalItems = [];
        cs.selectedCombos = [];
        cs.radioSelected = false;
        cs.tvSelected = false;
        cs.durationDays = 14;
        cs.startDate = '03/11/2026';
        cs.endDate = '17/11/2026';
      }

      window.renderResumoView = window.populateResumoScreen;

      if (!window.__upsellHooksBound) {
        window.__upsellHooksBound = true;
        var origGoToPagamento = window.goToPagamento;
        window.goToPagamento = function() {
          if (window.activeUpsellVariant === 'sugestao3') {
            window.openModalSugestao3();
            return;
          }
          if (typeof origGoToPagamento === 'function') origGoToPagamento();
        };

        var origOpenEnvioArte = window.openEnvioArteFromResumo;
        window.openEnvioArteFromResumo = function() {
          if (window.activeUpsellVariant === 'sugestao3') {
            window.openModalSugestao3();
            return;
          }
          if (typeof origOpenEnvioArte === 'function') origOpenEnvioArte();
        };
      }

      if (typeof window.showScreen === 'function') window.showScreen('view-resumo');
      if (typeof window.populateResumoScreen === 'function') window.populateResumoScreen();
      window.renderUpsellViews();
    };

    function bootUpsellPrototype() {
      if (window.AquiAdsUI && !window.AquiAdsUI.mounted) {
        window.AquiAdsUI.mount(window.AQUI_ADS_CONFIG);
      }
      window.setupUpsellPrototype();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootUpsellPrototype);
    } else {
      bootUpsellPrototype();
    }
  </script>
</body>
</html>
