    #calc-daily-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    #calc-daily-input {
      -moz-appearance: textfield;
    }

    /* Range Slider Oficial Light Mode (#FF4F00) */
    .calc-range-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 8px;
      border-radius: 9999px;
      background: linear-gradient(to right, #FF4F00 0%, #FF4F00 4.04%, #E2E8F0 4.04%, #E2E8F0 100%);
      outline: none;
      cursor: pointer;
    }
    .calc-range-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 3px solid #FF4F00;
      box-shadow: 0 2px 6px rgba(255, 79, 0, 0.35);
      cursor: pointer;
      transition: transform 0.12s ease, background-color 0.12s ease;
    }
    .calc-range-slider::-webkit-slider-thumb:hover {
      transform: scale(1.08);
    }
    .calc-range-slider::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 3px solid #FF4F00;
      box-shadow: 0 2px 6px rgba(255, 79, 0, 0.35);
      cursor: pointer;
      transition: transform 0.12s ease;
    }

    /* Header Simplificado: quando ativo, exibe EXCLUSIVAMENTE o logo oficial Aqui Ads */
    #main-header.calc-minimal-header > *:not(:first-child) {
      display: none !important;
    }
    #main-header.calc-minimal-header {
      border-bottom: 1px solid #E2E8F0 !important;
    }

    /* Na Página 1 Mobile, os 2 indicadores de resultado ficam lado a lado (2 colunas) como no mockup mobile */
    #viewport-container.mobile-frame #calc-result-metrics-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
      gap: 10px !important;
    }
    #viewport-container.mobile-frame .calc-metric-support-text {

    }
    #viewport-container.mobile-frame #calc-address-row {
      flex-direction: column !important;
      gap: 10px !important;
    }
    #viewport-container.mobile-frame #calc-use-location-btn {

      background-color: #FFFFFF !important;
      border: 1.5px solid #282E38 !important;
      color: #000929 !important;
    }

    /* Na Página 2 Mobile, as 3 métricas do Resumo ficam em 3 colunas horizontais como no mockup mobile */
    #viewport-container.mobile-frame #calc-p2-summary-metrics {
      display: grid !important;
      grid-template-columns: 1fr 1fr 1.15fr !important;
      gap: 8px !important;
    }
    #viewport-container.mobile-frame #calc-p2-summary-metrics > div {
      padding-top: 0 !important;
      border-top: 0 !important;
    }
    #viewport-container.mobile-frame #calc-p2-summary-metrics > div:not(:first-child) {

      padding-left: 8px !important;
    }
    #viewport-container.mobile-frame .calc-p2-metric-value {

    }
    #viewport-container.mobile-frame .calc-p2-metric-unit {

      flex-direction: row !important;
      align-items: center !important;

      0% { opacity: 0.55; transform: scale(0.992); }
      100% { opacity: 1; transform: scale(1); }
    }

      animation: calcPulse 0.24s ease-out;

    function getActiveOohCatalog() {
      try {
        const state = window.AquiAdsUI && typeof window.AquiAdsUI.getState === 'function'
          ? window.AquiAdsUI.getState()
          : null;
        if (state && Array.isArray(state.oohCatalog) && state.oohCatalog.length > 0) {
          return state.oohCatalog;
        }
      } catch (e) {
        // Fallback silencioso caso getState falhe
      }
      if (window.AQUI_ADS_MOCK_DATA && Array.isArray(window.AQUI_ADS_MOCK_DATA.oohCatalog) && window.AQUI_ADS_MOCK_DATA.oohCatalog.length > 0) {
        return window.AQUI_ADS_MOCK_DATA.oohCatalog;
      }
      return CALC_FALLBACK_OOH_CATALOG;
    }

    function resolveAddressMeta(rawAddr) {
      const trimmed = String(rawAddr || '').trim();
      if (!trimmed) return null;
      const lower = trimmed.toLowerCase();
      const exactIdx = CALC_SUGGESTED_ADDRESSES.findIndex(a => a.full.toLowerCase() === lower || a.short.toLowerCase() === lower);
      if (exactIdx !== -1) {
        const found = CALC_SUGGESTED_ADDRESSES[exactIdx];
        return {
          ...found,
          offset: exactIdx * 2
        };
      }
      let hash = 0;
      for (let i = 0; i < lower.length; i++) {
        hash = ((hash << 5) - hash + lower.charCodeAt(i)) | 0;
      }
      const absHash = Math.abs(hash);
      const customFactor = Number((0.88 + (absHash % 31) * 0.01).toFixed(2));
      const shortPart = trimmed.split(',')[0] || trimmed;
      return {
        full: trimmed,
        short: trimmed.length > 42 ? shortPart : trimmed,
        pillMob: shortPart + ' (raio próximo)',
        pillDesk: shortPart + ' • Raio de 1,5 km',
        factor: customFactor,
        offset: (absHash % 11) + 1
      };
    }

    function syncMainHeaderForScreen(screenId) {
      const mainHeader = document.getElementById('main-header');
      if (!mainHeader) return;
      if (screenId === 'view-calculadora-ooh') {
        mainHeader.classList.add('calc-minimal-header');
      } else {
        mainHeader.classList.remove('calc-minimal-header');
      }
    }

    function initOohDailyCalculator(api) {
      // 1. Garantir que o logo oficial local (logo-aqui-ads.svg / logo-aqui-ads.png) carregue no #main-header
      const mainHeader = document.getElementById('main-header');
      if (mainHeader) {
        const logoImg = mainHeader.querySelector('img');
        const logoLink = mainHeader.querySelector('a');
        if (logoImg) {
          logoImg.src = 'logo-aqui-ads.svg';
          logoImg.onerror = function() {
            this.onerror = null;
            this.src = 'logo-aqui-ads.png';
          };
        }
        if (logoLink) {
          logoLink.title = 'Voltar para a Calculadora OOH';
          logoLink.onclick = function() {
            showScreen('view-calculadora-ooh');
            goToCalculatorStep(1);
          };
        }
      }

      // 2. Adicionar título discreto na topbar escura (sem nenhum seletor de etapas!)
      const topBarInner = document.querySelector('header.bg-gray-950 > div');
      if (topBarInner && !document.getElementById('proto-discrete-title')) {
        const titleSpan = document.createElement('span');
        titleSpan.id = 'proto-discrete-title';
        titleSpan.className = 'text-[11px] font-medium text-gray-400 hidden sm:inline-block';
        titleSpan.textContent = 'Calculadora de Exibições e Alcance OOH por Dia';
        topBarInner.appendChild(titleSpan);
      }

      // 3. Injetar a section #view-calculadora-ooh logo antes de #view-resultados
      const viewResultados = document.getElementById('view-resultados');
      if (viewResultados && !document.getElementById('view-calculadora-ooh')) {
        viewResultados.insertAdjacentHTML('beforebegin', getCalculatorViewHTML());
      }

      // 4. Interceptar window.showScreen para alternar automaticamente entre Header Simplificado (Calculadora) e Header Completo (Resumo/Resultados)
      const originalShowScreen = window.showScreen;
      window.showScreen = function(screenId) {
        originalShowScreen(screenId);
        syncMainHeaderForScreen(screenId);
      };

      // 5. Fechar dropdown de autocomplete ao clicar fora
      document.addEventListener('click', (evt) => {
        const dd = document.getElementById('calc-address-dropdown');
        const inp = document.getElementById('calc-address-input');
        if (dd && !dd.contains(evt.target) && evt.target !== inp) {
          dd.classList.add('hidden');
        }
      });

      // 6. Pré-carregar os pontos recomendados na Página 2 mantendo o card de resultado da Página 1 oculto até o cliente preencher e calcular
      populateCalcAddressDropdown('');
      recalculateOohImpact(false);
      syncResultCardVisibility();
      showScreen('view-calculadora-ooh');
    }

    function syncResultCardVisibility() {
      const resCard = document.getElementById('calc-result-card');
      const inputCard = document.getElementById('calc-input-card');
      const clearBtn = document.getElementById('calc-clear-address-btn');
      const hasAddr = Boolean(String(calcState.selectedAddress || '').trim());

      if (clearBtn) {
        if (hasAddr) clearBtn.classList.remove('hidden');
        else clearBtn.classList.add('hidden');
      }

      if (!resCard || !inputCard) return;

      if (calcState.hasCalculated && hasAddr) {
        resCard.classList.remove('hidden');
        inputCard.classList.remove('lg:col-span-8', 'lg:col-start-3');
        inputCard.classList.add('lg:col-span-7');
      } else {
        resCard.classList.add('hidden');
        inputCard.classList.remove('lg:col-span-7');
        inputCard.classList.add('lg:col-span-8', 'lg:col-start-3');
      }
    }

    function updateSliderTrackFill(val) {
      const slider = document.getElementById('calc-daily-slider');
      if (!slider) return;
      const min = 10;
      const max = 1000;
      const clamped = Math.max(min, Math.min(max, Number(val) || 50));
      const pct = ((clamped - min) / (max - min)) * 100;
      slider.style.background = `linear-gradient(to right, #FF4F00 0%, #FF4F00 ${pct.toFixed(2)}%, #E2E8F0 ${pct.toFixed(2)}%, #E2E8F0 100%)`;
    }

    function updateQuickPillsHighlight(val) {
      const num = Number(val);
      document.querySelectorAll('#calc-quick-pills .calc-pill-btn').forEach(btn => {
        const bVal = Number(btn.getAttribute('data-val'));
        if (bVal === num) {
          btn.className = 'calc-pill-btn py-1.5 px-2 rounded-full text-xs font-bold border border-[#FF4F00] bg-[#FF4F00] text-white shadow-2xs transition cursor-pointer text-center';
        } else {
          btn.className = 'calc-pill-btn py-1.5 px-2 rounded-full text-xs font-semibold border border-[#DFE7EF] bg-white text-[#282E38] hover:border-[#FF4F00] transition cursor-pointer text-center';
        }
      });
    }

    function onCalcDailyInput(rawVal) {
      if (rawVal === '' || rawVal === null) return;
      let num = Number(rawVal);
      if (isNaN(num)) return;

      if (num > 1000) {
        num = 1000;
        const inp = document.getElementById('calc-daily-input');
        if (inp) inp.value = 1000;
        if (typeof showToast === 'function') {
          showToast('O limite máximo da simulação na calculadora é R$ 1.000/dia.');
        }
      }

      const effective = Math.max(10, Math.min(1000, num));
      calcState.dailyBudget = effective;

      const slider = document.getElementById('calc-daily-slider');
      if (slider) slider.value = effective;
      updateSliderTrackFill(effective);
      updateQuickPillsHighlight(effective);
    }

    function onCalcDailyBlur(rawVal) {
      let num = Number(rawVal);
      if (isNaN(num) || num < 10) {
        num = 10;
      } else if (num > 1000) {
        num = 1000;
      }
      calcState.dailyBudget = num;
      const inp = document.getElementById('calc-daily-input');
      const slider = document.getElementById('calc-daily-slider');
      if (inp) inp.value = num;
      if (slider) slider.value = num;
      updateSliderTrackFill(num);
      updateQuickPillsHighlight(num);
    }

    function onCalcSliderInput(val) {
      const num = Math.max(10, Math.min(1000, Number(val) || 50));
      calcState.dailyBudget = num;
      const inp = document.getElementById('calc-daily-input');
      if (inp) inp.value = num;
      updateSliderTrackFill(num);
      updateQuickPillsHighlight(num);
    }

    function selectCalcQuickPill(val) {
      const num = Number(val) || 50;
      calcState.dailyBudget = num;
      const inp = document.getElementById('calc-daily-input');
      const slider = document.getElementById('calc-daily-slider');
      if (inp) inp.value = num;
      if (slider) slider.value = num;
      updateSliderTrackFill(num);
      updateQuickPillsHighlight(num);
    }

    function populateCalcAddressDropdown(query) {
      const dd = document.getElementById('calc-address-dropdown');
      if (!dd) return;
      const q = String(query || '').toLowerCase().trim();
      const matches = CALC_SUGGESTED_ADDRESSES.filter(item =>
        !q || item.full.toLowerCase().includes(q)
      );
      const list = matches.length > 0 ? matches : CALC_SUGGESTED_ADDRESSES;

      dd.innerHTML = list.map((item, idx) => `
        <button type="button" onclick="selectCalcAddressByIndex(${CALC_SUGGESTED_ADDRESSES.indexOf(item)})"
          class="w-full text-left px-3.5 py-2 hover:bg-[#FFF3ED] flex items-center gap-2 text-xs text-[#000929] transition cursor-pointer">
          <span class="text-[#FF4F00] shrink-0">📍</span>
          <span class="truncate font-medium">${item.full}</span>
        </button>
      `).join('');
    }

    function openCalcAddressDropdown() {
      const dd = document.getElementById('calc-address-dropdown');
      if (!dd) return;
      populateCalcAddressDropdown('');
      dd.classList.remove('hidden');
    }

    function filterCalcAddressDropdown(val) {
      const trimmed = String(val || '').trim();
      calcState.selectedAddress = val;
      const clearBtn = document.getElementById('calc-clear-address-btn');
      if (clearBtn) {
        if (trimmed) clearBtn.classList.remove('hidden');
        else clearBtn.classList.add('hidden');
      }
      if (trimmed) {
        setAddressValidationError(false);
        calcState.addressMeta = resolveAddressMeta(trimmed);
      } else {
        calcState.addressMeta = null;
        calcState.hasCalculated = false;
        syncResultCardVisibility();
      }
      populateCalcAddressDropdown(val);
      const dd = document.getElementById('calc-address-dropdown');
      if (dd) dd.classList.remove('hidden');
    }

    function selectCalcAddressByIndex(idx) {
      const item = CALC_SUGGESTED_ADDRESSES[idx] || CALC_SUGGESTED_ADDRESSES[0];
      calcState.selectedAddress = item.full;
      calcState.addressMeta = resolveAddressMeta(item.full);
      setAddressValidationError(false);
      const inp = document.getElementById('calc-address-input');
      const dd = document.getElementById('calc-address-dropdown');
      const clearBtn = document.getElementById('calc-clear-address-btn');
      if (inp) inp.value = item.full;
      if (dd) dd.classList.add('hidden');
      if (clearBtn) clearBtn.classList.remove('hidden');
      if (typeof showToast === 'function') {
        showToast(`Região selecionada: ${item.short}`);
      }
    }

    function clearCalcAddressInput(evt) {
      if (evt) evt.stopPropagation();
      calcState.selectedAddress = '';
      calcState.addressMeta = null;
      calcState.hasCalculated = false;
      const inp = document.getElementById('calc-address-input');
      if (inp) {
        inp.value = '';
        inp.focus();
      }
      syncResultCardVisibility();
      openCalcAddressDropdown();
    }

    function useCurrentLocationForCalc() {
      const defaultLoc = CALC_SUGGESTED_ADDRESSES[0];
      calcState.selectedAddress = defaultLoc.full;
      calcState.addressMeta = resolveAddressMeta(defaultLoc.full);
      setAddressValidationError(false);
      const inp = document.getElementById('calc-address-input');
      const dd = document.getElementById('calc-address-dropdown');
      const clearBtn = document.getElementById('calc-clear-address-btn');
      if (inp) inp.value = defaultLoc.full;
      if (dd) dd.classList.add('hidden');
      if (clearBtn) clearBtn.classList.remove('hidden');
      if (typeof showToast === 'function') {
        showToast('📍 Localização atual preenchida: Rua Alvorada, 1217 - Vila Olímpia');
      }
    }

    function triggerCalcAction() {
      const dailyInp = document.getElementById('calc-daily-input');
      const sliderInp = document.getElementById('calc-daily-slider');
      if (dailyInp) {
        let parsedDaily = Number(dailyInp.value);
        if (isNaN(parsedDaily) || parsedDaily < 10) parsedDaily = 10;
        if (parsedDaily > 1000) parsedDaily = 1000;
        calcState.dailyBudget = parsedDaily;
        dailyInp.value = parsedDaily;
        if (sliderInp) sliderInp.value = parsedDaily;
        updateSliderTrackFill(parsedDaily);
        updateQuickPillsHighlight(parsedDaily);
      }

      const addrInp = document.getElementById('calc-address-input');
      const dd = document.getElementById('calc-address-dropdown');
      if (dd) dd.classList.add('hidden');

      const currentAddr = String((addrInp ? addrInp.value : calcState.selectedAddress) || '').trim();
      if (!currentAddr) {
        setAddressValidationError(true);
        if (addrInp) addrInp.focus();
        if (typeof showToast === 'function') {
          showToast('Informe o endereço, bairro ou CEP onde você quer anunciar.');
        }
        return;
      }

      setAddressValidationError(false);
      calcState.selectedAddress = currentAddr;
      calcState.addressMeta = resolveAddressMeta(currentAddr);
      calcState.hasCalculated = true;
      syncResultCardVisibility();
      recalculateOohImpact(true);

      const resCard = document.getElementById('calc-result-card');
      const container = document.getElementById('viewport-container');
      if (resCard) {
        if (container && container.classList.contains('mobile-frame')) {
          resCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } else if (window.innerWidth < 1024) {
          resCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }
      if (typeof showToast === 'function') {
        const shortLoc = (calcState.addressMeta && calcState.addressMeta.short) || currentAddr;
        showToast(`Alcance calculado para R$ ${calcState.dailyBudget}/dia em ${shortLoc}!`);
      }
    }

    function recalculateOohImpact(animate = false) {
      const catalog = getActiveOohCatalog();

      const daily = Math.max(10, Math.min(1000, Number(calcState.dailyBudget) || 50));
      const locFactor = (calcState.addressMeta && calcState.addressMeta.factor) || 1.0;
      const locOffset = (calcState.addressMeta && typeof calcState.addressMeta.offset === 'number') ? calcState.addressMeta.offset : 0;
      const ratio = (daily / 50) * locFactor;

      // 1. Cálculo das Faixas na Página 1 (Ancorado em 85.000 a 120.000 exibições e 28.000 a 42.000 pessoas para R$ 50/dia)
      let lowViews = 85000;
      let highViews = 120000;
      let lowReach = 28000;
      let highReach = 42000;
      let exactViews30d = 98640;
      let exactReach30d = 31400;

      if (Math.abs(ratio - 1.0) > 0.001) {
        lowViews = Math.max(15000, Math.round((85000 * ratio) / 500) * 500);
        highViews = Math.max(22000, Math.round((120000 * ratio) / 500) * 500);
        lowReach = Math.max(5000, Math.round((28000 * ratio) / 200) * 200);
        highReach = Math.max(8000, Math.round((42000 * ratio) / 200) * 200);
        exactViews30d = Math.round(98640 * ratio);
        exactReach30d = Math.round(31400 * ratio);
      }

      // 2. Seleção dinâmica das telas recomendadas de oohCatalog conforme o orçamento diário e a região
      let numPoints = 4;
      if (daily <= 25) numPoints = 2;
      else if (daily <= 40) numPoints = 3;
      else if (daily <= 65) numPoints = 4;
      else if (daily <= 120) numPoints = 6;
      else if (daily <= 250) numPoints = 8;
      else if (daily <= 500) numPoints = 10;
      else numPoints = Math.min(12, catalog.length);

      const rotatedCatalog = [];
      for (let i = 0; i < catalog.length; i++) {
        rotatedCatalog.push(catalog[(i + locOffset) % catalog.length]);
      }
      calcState.recommendedPoints = rotatedCatalog.slice(0, numPoints);

      // 3. Atualizar DOM da Página 1
      const addrLabelEl = document.getElementById('calc-res-address-label');
      const viewsRangeEl = document.getElementById('calc-res-views-range');
      const reachRangeEl = document.getElementById('calc-res-reach-range');
      const resCard = document.getElementById('calc-result-card');

      if (addrLabelEl) {
        addrLabelEl.textContent = (calcState.addressMeta && calcState.addressMeta.short) || 'Rua Alvorada, 1217 - Vila Olímpia';
      }
      if (viewsRangeEl) {
        viewsRangeEl.textContent = `${formatIntPT(lowViews)} a ${formatIntPT(highViews)} exibições`;
      }
      if (reachRangeEl) {
        reachRangeEl.textContent = `${formatIntPT(lowReach)} a ${formatIntPT(highReach)} pessoas`;
      }
      if (animate && resCard) {
        resCard.classList.remove('calc-updating');
        void resCard.offsetWidth;
        resCard.classList.add('calc-updating');
      }

      // 4. Atualizar DOM da Página 2 (Resumo + Pílulas + Lista de Cards Horizontais Compactos)
      const p2MobLoc = document.getElementById('calc-p2-mob-location-pill');
      const p2DeskLoc = document.getElementById('calc-p2-desk-location-pill');
      const p2DeskBudget = document.getElementById('calc-p2-desk-budget-pill');
      const p2Views = document.getElementById('calc-p2-total-views');
      const p2Reach = document.getElementById('calc-p2-total-reach');
      const p2DailyVal = document.getElementById('calc-p2-daily-val');
      const p2InstText = document.getElementById('calc-p2-installments-text');

      const total4w = daily * 28;
      const installmentVal = total4w / 3;

      if (p2MobLoc && calcState.addressMeta) p2MobLoc.textContent = calcState.addressMeta.pillMob;
      if (p2DeskLoc && calcState.addressMeta) p2DeskLoc.textContent = calcState.addressMeta.pillDesk;
      if (p2DeskBudget) p2DeskBudget.textContent = `R$ ${daily}/dia`;
      if (p2Views) p2Views.textContent = formatIntPT(exactViews30d);
      if (p2Reach) p2Reach.textContent = formatIntPT(exactReach30d);
      if (p2DailyVal) p2DailyVal.textContent = formatCurrencyPT(daily);
      if (p2InstText) {
        p2InstText.textContent = `Total (4 semanas): ${formatCurrencyPT(total4w)} em até 3x de ${formatCurrencyPT(installmentVal)} sem juros`;
      }

      renderCalculatorRecommendedPoints();
    }

    function formatCompactViews30d(views2w) {
      const v30 = (Number(views2w) || 16200) * 2;
      if (v30 >= 1000) {
        const k = v30 / 1000;
        const formatted = Number.isInteger(k)
          ? String(k)
          : k.toFixed(2).replace(/\.?0+$/, '').replace('.', ',');
        return `${formatted} mil`;
      }
      return formatIntPT(v30);
    }

    function shortenOohAddress(fullAddr) {
      const raw = String(fullAddr || '').split(' - ')[0].trim();
      return raw.replace(/^Rua Gomes de Carvalho/i, 'R. Gomes de Carvalho')
                .replace(/^Rua Clodomiro Amazonas/i, 'R. Clodomiro Amazonas')
                .replace(/^Rua Doutor Cardoso de Melo/i, 'R. Dr. Cardoso de Melo')
                .replace(/^Rua Ministro Jesuíno Cardoso/i, 'R. Min. Jesuíno Cardoso');
    }

    function renderOohPointCardsHTML(pointsList) {
      const points = (Array.isArray(pointsList) && pointsList.length > 0)
        ? pointsList
        : getActiveOohCatalog().slice(0, 4);

      return points.map(item => {
        const imgUrl = item.photo || item.img;
        const shortAddr = shortenOohAddress(item.address);
        const envShort = item.environmentShort || (String(item.environmentLabel || '').includes('comercia') ? 'comercial' : 'residencial');
        const fmt = (item.format || 'digital').toLowerCase();
        const fmtBg = fmt === 'impresso' ? 'bg-[#009A61]' : 'bg-[#3C20A6]';
        const views30dStr = formatCompactViews30d(item.views2w || item.impressions || 16200);
        const reach30dNum = (Number(item.reach2w || item.reach) || 872) * 2;
        const reach30dStr = formatIntPT(reach30dNum);
        const price30d = item.price4w || (item.basePrice2w ? item.basePrice2w * 1.8 : 476.92);

        return `
          <article class="bg-white border border-[#DFE7EF] hover:border-[#CBD5E1] rounded-2xl p-3 sm:p-4 flex items-center justify-between gap-3 sm:gap-4 shadow-[0_2px_10px_rgba(0,9,41,0.03)] transition">
            <div class="flex items-center gap-3 sm:gap-3.5 min-w-0 flex-1">
              <!-- Miniatura 64x64px arredondada -->
              <img
                src="${imgUrl}"
                alt="${item.name}"
                onclick="openOohPointModal('${item.id}')"
                class="w-16 h-16 sm:w-[68px] sm:h-[68px] rounded-xl object-cover shrink-0 border border-[#E2E8F0] cursor-pointer hover:opacity-90 transition"
              >

              <!-- Identificação, Pílulas e Métricas em Linha -->
              <div class="min-w-0 flex-1">
                <h4 onclick="openOohPointModal('${item.id}')"
                  class="text-sm sm:text-base font-extrabold text-[#000929] hover:text-[#FF4F00] cursor-pointer leading-tight truncate transition"
                  title="${item.name}">
                  ${item.name}
                </h4>
                <p class="text-[11.5px] sm:text-xs text-[#282E38] mt-0.5 truncate">
                  ${shortAddr} • ${item.distance || '150 m'}
                </p>

                <div class="flex flex-wrap items-center gap-1.5 mt-1.5">
                  <span class="px-2 py-0.5 rounded-full text-[10.5px] font-semibold bg-[#F8FAFC] border border-[#CBD5E1] text-[#282E38]">
                    ${envShort}
                  </span>
                  <span class="px-2.5 py-0.5 rounded-full text-[10.5px] font-bold text-white ${fmtBg}">
                    ${fmt}
                  </span>
                  <span class="text-[11.5px] sm:text-xs font-extrabold text-[#000929] ml-0.5">
                    ${views30dStr} <span class="font-normal text-[#282E38]">exib.</span> • ${reach30dStr} <span class="font-normal text-[#282E38]">alc.</span>
                  </span>
                </div>
              </div>
            </div>

            <!-- Coluna Direita: Preço 4 semanas + Badge Incluído -->
            <div class="text-right shrink-0 flex flex-col items-end justify-center">
              <div class="text-xs sm:text-sm font-extrabold text-[#000929] whitespace-nowrap">
                ${formatCurrencyPT(price30d)} <span class="font-normal text-[#282E38] text-[11px]">/ 4 semanas</span>
              </div>
              <span class="mt-1.5 inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10.5px] font-semibold bg-[#F4FCF7] border border-[#24C765] text-[#007800]">
                <span>✓</span>
                <span>Incluído</span>
              </span>
            </div>
          </article>
        `;
      }).join('');
    }

    function renderCalculatorRecommendedPoints() {
      const listEl = document.getElementById('calc-p2-points-list');
      if (!listEl) return;
      listEl.innerHTML = renderOohPointCardsHTML(calcState.recommendedPoints);
    }

    function goToCalculatorStep(stepNumber, focusField) {
      calcState.currentStep = stepNumber;
      const step1 = document.getElementById('calc-step-1');
      const step2 = document.getElementById('calc-step-2');
      if (!step1 || !step2) return;

      if (stepNumber === 2) {
        step1.classList.add('hidden');
        step1.style.display = 'none';
        step2.classList.remove('hidden');
        step2.style.display = 'block';
        try {
          recalculateOohImpact(false);
          renderCalculatorRecommendedPoints();
        } catch (err) {
          console.error('Erro ao renderizar Página 2:', err);
        }
      } else {
        step2.classList.add('hidden');
        step2.style.display = 'none';
        step1.classList.remove('hidden');
        step1.style.display = 'block';
        if (focusField === 'budget') {
          setTimeout(() => {
            const inp = document.getElementById('calc-daily-input');
            if (inp) { inp.focus(); inp.select(); }
          }, 60);
        } else if (focusField === 'address') {
          setTimeout(() => {
            const inp = document.getElementById('calc-address-input');
            if (inp) { inp.focus(); }
          }, 60);
        }
      }

      const container = document.getElementById('viewport-container');
      if (container && container.classList.contains('mobile-frame')) {
        container.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function convertCalculatorToCartSummary() {
      let apiState = null;
      try {
        apiState = window.AquiAdsUI ? window.AquiAdsUI.getState() : null;
      } catch (e) {}
      if (apiState && apiState.cartState) {
        const cs = apiState.cartState;
        cs.durationDays = 28;
        cs.startDate = '28/10/2026';
        cs.endDate = '25/11/2026';
        const shortLoc = (calcState.addressMeta && calcState.addressMeta.short) || 'Vila Olímpia';
        cs.campaignName = `Campanha OOH - ${shortLoc}`.slice(0, 30);
        cs.digitalItems = [];
        cs.oohItems = (calcState.recommendedPoints || []).map(pt => ({
          ...pt,
          selectedForBatch: false
        }));
      }

      if (window.AquiAdsUI && typeof window.AquiAdsUI.refresh === 'function') {
        try { window.AquiAdsUI.refresh(); } catch (e) {}
      }
      showScreen('view-resumo');
      if (typeof showToast === 'function') {
        showToast('Campanha adicionada ao carrinho! Revise o resumo do seu pedido.');
      }
    }

    function convertCalculatorToResultsPage() {
      let apiState = null;
      try {
        apiState = window.AquiAdsUI ? window.AquiAdsUI.getState() : null;
      } catch (e) {}
      if (apiState && apiState.cartState) {
        apiState.cartState.durationDays = 28;
      }
      const plpAddr = document.getElementById('plp-search-address');
      if (plpAddr) {
        plpAddr.value = calcState.selectedAddress || 'Rua Alvorada, 1217 - Vila Olímpia, São Paulo';
      }
      const durLbl = document.getElementById('plp-ooh-duration-label');
      if (durLbl) {
        durLbl.textContent = '4 semanas';
      }

      showScreen('view-resultados');
      if (typeof switchPlpChannel === 'function') {
        switchPlpChannel('ooh');
      }
      if (typeof showToast === 'function') {
        const shortLoc = (calcState.addressMeta && calcState.addressMeta.short) || calcState.selectedAddress;
        showToast('Exibindo pontos de OOH próximos a ' + shortLoc);
      }
    }
  </script>
