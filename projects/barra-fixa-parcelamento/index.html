<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Protótipo — Melhorias na Barra Fixa (Página de Resultados)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="aqui_ads_official.css" />
  <style>
    /* 1. Pílula de Parcelamento Sem Juros (Foco de Conversão) */
    .installment-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #FFF0EB;
      border: 1px solid #FFD4C4;
      color: #FA4800;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    /* 2. Pílulas de Alcance & Impactos Estimados */
    .metric-bubble-group {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 12px;
      color: #334155;
      white-space: nowrap;
    }

    /* 5. Combo 1 + 2: Alcance + Parcelamento em Pílula Integrada */
    .combo-pill-container {
      display: inline-flex;
      align-items: center;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 9999px;
      padding: 4px 6px 4px 14px;
      gap: 12px;
      white-space: nowrap;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    /* 6. Combo 1 + 2 (Preço por Dia): Alcance + Custo Diário */
    .combo-daily-container {
      display: inline-flex;
      align-items: center;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 9999px;
      padding: 4px 6px 4px 14px;
      gap: 12px;
      white-space: nowrap;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    .daily-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ECFDF5;
      border: 1px solid #A7F3D0;
      color: #047857;
      padding: 5px 12px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .combo-badge-juros {
      background: #FA4800;
      color: #FFFFFF;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .combo-badge-daily {
      background: #059669;
      color: #FFFFFF;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body class="bg-slate-50">
  <!-- Ponto de Montagem do App Shell & Jornada Unificada (aqui_ads_ui.js) -->
  <div id="aqui-ads-app"></div>

  <script src="aqui_ads_mock_data.js"></script>
  <script>
    window.AQUI_ADS_MANUAL_MOUNT = true;
  </script>
  <script src="aqui_ads_ui.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    window.currentViewMode = urlParams.get('mode') === 'simulador' ? 'simulador' : 'final';
    window.currentProposal = 3; // ⭐ 3. Parcela (3x) + Alcance (Decisão Oficial)

    window.setProtoViewMode = function(mode) {
      window.currentViewMode = mode === 'simulador' ? 'simulador' : 'final';
      if (window.currentViewMode === 'final') {
        window.currentProposal = 3;
      }
      const finalBanner = document.getElementById('top-bar-mode-final');
      const simBanner = document.getElementById('top-bar-mode-simulador');
      if (finalBanner && simBanner) {
        if (window.currentViewMode === 'final') {
          finalBanner.classList.remove('hidden');
          finalBanner.classList.add('flex');
          simBanner.classList.add('hidden');
          simBanner.classList.remove('flex');
        } else {
          finalBanner.classList.add('hidden');
          finalBanner.classList.remove('flex');
          simBanner.classList.remove('hidden');
          simBanner.classList.add('flex');
        }
      }
      window.selectProposal(window.currentProposal);
    };

    window.selectProposal = function(num) {
      window.currentProposal = num;
      document.querySelectorAll('.prop-btn').forEach(btn => {
        const btnNum = parseInt(btn.getAttribute('data-prop'), 10);
        const isSelected = btnNum === num;
        if (isSelected) {
          btn.className = 'prop-btn px-2.5 py-1 text-[11px] font-bold rounded-md transition-all bg-[#FA4800] text-white shadow-sm cursor-pointer';
        } else {
          btn.className = 'prop-btn px-2.5 py-1 text-[11px] font-semibold rounded-md transition-all text-slate-300 hover:text-white hover:bg-slate-700/60 cursor-pointer';
        }
      });
      window.renderCustomStickyBar();
    };

    window.ensureCustomStickyBarStructure = function() {
      const bar = document.getElementById('actions-bar-results');
      if (!bar) return null;
      if (!document.getElementById('deskCentralSlot')) {
        bar.className = 'sticky bottom-0 left-0 right-0 w-full z-40 border-t border-slate-200 bg-white shadow-[0_-4px_12px_rgba(0,0,0,0.06)] flex flex-col transition-all duration-200';
        bar.innerHTML = `
          <div id="plp-mobile-context-strip" class="hidden w-full"></div>
          <div class="w-full py-2.5 px-6 flex items-center justify-between gap-4">
            <div id="plp-bar-empty-state" class="hidden items-center gap-2 text-xs text-slate-500 font-medium py-1">
              <span class="w-2 h-2 rounded-full bg-slate-300 shrink-0"></span>
              <span>Selecione pontos no mapa ou na lista para simular seu <strong>alcance estimado</strong> e <strong>parcelamento em até 3x sem juros</strong>.</span>
            </div>
            <div id="plp-bar-summary-left" class="flex flex-col text-left shrink-0">
              <span id="plp-bar-count-label" class="text-xs text-slate-600"><strong id="plp-bar-count" class="font-bold text-slate-800">2</strong> pontos selecionados</span>
              <div class="flex items-baseline gap-1.5">
                <span class="text-sm text-slate-700">Total:</span>
                <strong id="plp-bar-total" class="text-lg font-extrabold text-slate-900">R$ 529,92</strong>
              </div>
              <div id="plp-bar-sub-left" class="hidden text-[11px] font-semibold mt-0.5"></div>
            </div>
            <div id="deskCentralSlot" class="hidden md:flex items-center justify-center flex-1 px-4"></div>
            <div class="flex items-center gap-2 shrink-0 ml-auto">
              <button id="resultpage_next-button" type="button" onclick="showScreen('view-resumo')" class="btn btn-primary cursor-pointer font-bold rounded-xl shadow-none h-10 px-6 bg-[#FA4800] hover:bg-[#e04000] text-white text-sm transition flex items-center gap-2">
                <span id="plp-next-btn-label">Avançar</span>
              </button>
            </div>
          </div>
        `;
      }
      return bar;
    };

    window.renderCustomStickyBar = function() {
      const bar = window.ensureCustomStickyBarStructure();
      if (!bar) return;

      const isMobile = document.getElementById('viewport-container')?.classList.contains('mobile-frame');
      const state = (window.AquiAdsUI && typeof window.AquiAdsUI.getState === 'function')
        ? window.AquiAdsUI.getState()
        : null;
      const cs = (state && state.cartState) || window.cartState || { oohItems: [], digitalItems: [], durationDays: 14 };
      const oohItems = Array.isArray(cs.oohItems) ? cs.oohItems : [];
      const digitalItems = Array.isArray(cs.digitalItems) ? cs.digitalItems : [];
      const count = oohItems.length + digitalItems.length;
      const campaignDays = cs.durationDays === 28 ? 28 : 14;
      const mult = campaignDays === 28 ? 1.85 : 1;

      const oohTotal = oohItems.reduce((acc, item) => acc + ((Number(item.basePrice2w ?? item.price2w) || 0) * mult), 0);
      const digTotal = digitalItems.reduce((acc, item) => acc + (Number(item.budget) || 0), 0);
      const subtotal = oohTotal + digTotal + (Number(cs.creativeServiceFee) || 0);
      const totalValue = Math.max(0, subtotal - (Number(cs.discountAmount) || 0));

      const emptyEl = document.getElementById('plp-bar-empty-state');
      const summaryLeftEl = document.getElementById('plp-bar-summary-left');
      const deskSlot = document.getElementById('deskCentralSlot');
      const mobStrip = document.getElementById('plp-mobile-context-strip');
      const subLeft = document.getElementById('plp-bar-sub-left');
      const nextBtnEl = document.getElementById('resultpage_next-button');
      const nextBtnLabel = document.getElementById('plp-next-btn-label');
      const badgeEl = document.getElementById('hdr-cart-badge');

      bar.style.display = 'flex';

      if (count <= 0 || totalValue <= 0) {
        if (emptyEl) {
          emptyEl.classList.remove('hidden');
          emptyEl.classList.add('flex');
        }
        if (summaryLeftEl) summaryLeftEl.classList.add('hidden');
        if (deskSlot) deskSlot.className = 'hidden';
        if (mobStrip) mobStrip.className = 'hidden w-full';
        if (subLeft) subLeft.className = 'hidden';
        if (nextBtnEl) {
          nextBtnEl.className = 'bg-[#E2E8F0] text-[#94A3B8] cursor-not-allowed pointer-events-none h-10 px-6 rounded-xl font-bold text-sm flex items-center gap-2';
        }
        if (badgeEl) {
          badgeEl.textContent = '0';
          badgeEl.classList.add('hidden');
        }
        return;
      }

      if (emptyEl) {
        emptyEl.classList.add('hidden');
        emptyEl.classList.remove('flex');
      }
      if (summaryLeftEl) summaryLeftEl.classList.remove('hidden');
      if (nextBtnEl) {
        nextBtnEl.className = 'btn btn-primary cursor-pointer font-bold rounded-xl shadow-none h-10 px-6 bg-[#FA4800] hover:bg-[#e04000] text-white text-sm transition flex items-center gap-2';
      }
      if (badgeEl) {
        badgeEl.textContent = String(count);
        badgeEl.classList.remove('hidden');
      }

      const countLabelEl = document.getElementById('plp-bar-count-label');
      const totalEl = document.getElementById('plp-bar-total');
      if (countLabelEl) {
        countLabelEl.innerHTML = `<strong id="plp-bar-count" class="font-bold text-slate-800">${count}</strong> ${count === 1 ? 'ponto selecionado' : 'pontos selecionados'}`;
      }
      if (totalEl) {
        totalEl.textContent = totalValue.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
      }

      const prop = window.currentProposal ?? 3;
      const installmentVal = (totalValue / 3).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
      const dailyTotalVal = (totalValue / campaignDays).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
      const dailyPerScreenVal = (totalValue / campaignDays / Math.max(count, 1)).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

      const impMult = campaignDays === 28 ? 2 : 1;
      let totalImpressions = oohItems.reduce((acc, item) => acc + ((Number(item.impressions ?? item.views2w) || 16200) * impMult), 0);
      if (totalImpressions === 0 && digitalItems.length > 0) {
        totalImpressions = digitalItems.reduce((acc, item) => acc + (Number(item.estimatedViews) || 45000), 0);
      }
      const formattedImpressions = totalImpressions >= 1000
        ? `+${(totalImpressions / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 })} mil`
        : `+${totalImpressions}`;
      const estimatedScreens = oohItems.reduce((acc, item) => acc + (Number(item.screens) || 2), 0) || (count * 2);

      if (!deskSlot || !mobStrip || !subLeft) return;

      deskSlot.className = 'hidden md:flex items-center justify-center flex-1 px-4';
      mobStrip.className = 'hidden w-full';
      subLeft.className = 'hidden text-[11px] font-semibold mt-0.5';
      if (nextBtnLabel) nextBtnLabel.textContent = 'Avançar';

      if (prop === 0) {
        // 0. Atual (Produção)
        deskSlot.className = 'hidden';
      } else if (prop === 1) {
        // 1. Só Alcance + Telas
        deskSlot.innerHTML = `
          <div class="metric-bubble-group">
            <span class="flex items-center gap-1.5 font-semibold text-slate-700">
              <svg class="w-4 h-4 text-[#FA4800]" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              <span>Alcance: <strong>${formattedImpressions}</strong> impressões</span>
            </span>
            <span class="text-slate-300">|</span>
            <span class="flex items-center gap-1.5 font-semibold text-slate-700">
              <svg class="w-4 h-4 text-indigo-600" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><line x1="8" y1="20" x2="16" y2="20"/><line x1="12" y1="16" x2="12" y2="20"/></svg>
              <span>Telas ativas: <strong>${estimatedScreens} faces</strong></span>
            </span>
          </div>
        `;
        if (isMobile) {
          deskSlot.className = 'hidden';
          mobStrip.className = 'flex items-center justify-between px-4 py-1.5 bg-slate-50 border-b border-slate-200 text-[11px] text-slate-700 font-semibold';
          mobStrip.innerHTML = `
            <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-[#FA4800]"></span> Alcance: ${formattedImpressions} impressões</span>
            <span class="text-slate-400">•</span>
            <span>${estimatedScreens} telas ativas</span>
          `;
        }
      } else if (prop === 2) {
        // 2. Só Parcelamento (3x)
        deskSlot.innerHTML = `
          <div class="installment-pill">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
            <span>ou em até <strong>3x de ${installmentVal} sem juros</strong> (Cartões & Pix)</span>
          </div>
        `;
        if (isMobile) {
          deskSlot.className = 'hidden';
          subLeft.className = 'block text-[11px] font-bold text-[#FA4800] mt-0.5';
          subLeft.innerHTML = `ou em até 3x de ${installmentVal} s/ juros`;
        }
      } else if (prop === 3) {
        // ⭐ 3. Parcela (3x) + Alcance — VERSÃO FINAL DECIDIDA
        deskSlot.innerHTML = `
          <div class="combo-pill-container">
            <span class="flex items-center gap-1.5 text-xs font-semibold text-slate-700" title="Estimativa de visualizações totais dos pontos selecionados">
              <svg class="w-4 h-4 text-[#FA4800] shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              <span><strong class="text-slate-900 font-extrabold">${formattedImpressions}</strong> impressões</span>
              <span class="text-slate-300 mx-0.5">•</span>
              <span class="text-slate-600"><strong>${estimatedScreens}</strong> faces</span>
            </span>
            <div class="installment-pill !py-1 !px-3">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
              <span>Até <strong>3x de ${installmentVal}</strong></span>
              <span class="combo-badge-juros">Sem Juros</span>
            </div>
          </div>
        `;
        if (isMobile) {
          deskSlot.className = 'hidden';
          mobStrip.className = 'flex items-center justify-between px-4 py-1.5 bg-[#F8FAFC] border-b border-slate-200 text-[11px] text-slate-700 font-semibold';
          mobStrip.innerHTML = `
            <span class="flex items-center gap-1.5">
              <svg class="w-3.5 h-3.5 text-[#FA4800]" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              <span><strong class="text-slate-900">${formattedImpressions}</strong> impressões</span>
            </span>
            <span class="text-slate-500 font-medium">${estimatedScreens} faces digitais</span>
          `;
          subLeft.className = 'flex items-center gap-1 text-[11px] font-bold text-[#FA4800] mt-0.5';
          subLeft.innerHTML = `
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
            <span>ou 3x de ${installmentVal} s/ juros</span>
          `;
        }
      } else if (prop === 4) {
        // 4. Só Valor por Dia
        deskSlot.innerHTML = `
          <div class="daily-pill">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span>Investimento diário: <strong>${dailyTotalVal} / dia</strong> (Período: ${campaignDays} dias)</span>
          </div>
        `;
        if (isMobile) {
          deskSlot.className = 'hidden';
          subLeft.className = 'flex items-center gap-1 text-[11px] font-bold text-emerald-700 mt-0.5';
          subLeft.innerHTML = `
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span>Equivalente a ${dailyTotalVal}/dia (${campaignDays} dias)</span>
          `;
        }
      } else if (prop === 5) {
        // 🔥 5. Valor por Dia + Alcance
        deskSlot.innerHTML = `
          <div class="combo-daily-container">
            <span class="flex items-center gap-1.5 text-xs font-semibold text-slate-700" title="Estimativa de visualizações totais em ${campaignDays} dias de campanha">
              <svg class="w-4 h-4 text-[#FA4800] shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              <span><strong class="text-slate-900 font-extrabold">${formattedImpressions}</strong> impressões</span>
              <span class="text-slate-300 mx-0.5">•</span>
              <span class="text-slate-600"><strong>${campaignDays} dias</strong> ativos</span>
            </span>
            <div class="daily-pill !py-1 !px-3" title="Equivalente a ${dailyPerScreenVal}/dia por ponto selecionado">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              <span>POR DIA: <strong>${dailyTotalVal}/dia</strong></span>
              <span class="combo-badge-daily">${dailyPerScreenVal}/ponto</span>
            </div>
          </div>
        `;
        if (isMobile) {
          deskSlot.className = 'hidden';
          mobStrip.className = 'flex items-center justify-between px-4 py-1.5 bg-[#F8FAFC] border-b border-slate-200 text-[11px] text-slate-700 font-semibold';
          mobStrip.innerHTML = `
            <span class="flex items-center gap-1.5">
              <svg class="w-3.5 h-3.5 text-[#FA4800]" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              <span><strong class="text-slate-900">${formattedImpressions}</strong> impressões</span>
            </span>
            <span class="text-emerald-700 font-bold bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-200">${dailyPerScreenVal}/dia por ponto</span>
          `;
          subLeft.className = 'flex items-center gap-1 text-[11px] font-bold text-emerald-700 mt-0.5';
          subLeft.innerHTML = `
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span>POR DIA: ${dailyTotalVal}/dia (${campaignDays} dias)</span>
          `;
        }
      } else if (prop === 6) {
        // 💎 6. Visão Completa (Dia + 3x + Alcance)
        deskSlot.innerHTML = `
          <div class="combo-pill-container">
            <span class="flex items-center gap-1.5 text-xs font-semibold text-slate-700">
              <svg class="w-4 h-4 text-[#FA4800] shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              <span><strong class="text-slate-900 font-extrabold">${formattedImpressions}</strong> (${estimatedScreens} telas)</span>
            </span>
            <div class="daily-pill !py-1 !px-2.5 !text-xs">
              <span><strong>${dailyTotalVal}/dia</strong></span>
            </div>
            <div class="installment-pill !py-1 !px-2.5 !text-xs">
              <span><strong>3x de ${installmentVal}</strong></span>
              <span class="combo-badge-juros">S/ Juros</span>
            </div>
          </div>
        `;
        if (isMobile) {
          deskSlot.className = 'hidden';
          mobStrip.className = 'flex items-center justify-between px-4 py-1.5 bg-[#F8FAFC] border-b border-slate-200 text-[11px] text-slate-700 font-semibold';
          mobStrip.innerHTML = `
            <span><strong class="text-slate-900">${formattedImpressions}</strong> (${estimatedScreens} telas)</span>
            <span class="text-emerald-700 font-bold">${dailyTotalVal}/dia</span>
          `;
          subLeft.className = 'flex items-center gap-1 text-[11px] font-bold text-[#FA4800] mt-0.5';
          subLeft.innerHTML = `<span>ou 3x de ${installmentVal} s/ juros</span>`;
        }
      }
    };

    AquiAdsUI.mount({
      initialView: 'resultados',
      cartPreset: 'oohOnly',
      hooks: {
        renderBottomBar: function() {
          window.renderCustomStickyBar();
        },
        onReady: function() {
          window.ensureCustomStickyBarStructure();

          // Intercepta syncPlpStickyBar e setViewportMode do template v2 para atualizar a barra customizada em tempo real
          const origSync = window.syncPlpStickyBar;
          window.syncPlpStickyBar = function() {
            if (typeof origSync === 'function') origSync();
            window.renderCustomStickyBar();
          };

          const origViewport = window.setViewportMode;
          window.setViewportMode = function(mode) {
            if (typeof origViewport === 'function') origViewport(mode);
            setTimeout(() => window.renderCustomStickyBar(), 20);
          };

          // Injeta a barra de controle superior com alternância entre Versão Final Decidida (⭐ 3) e Simulador Completo (7 Opções)
          const topBarRight = document.querySelector('#aqui-ads-shell-root > header > div');
          if (topBarRight) {
            const propControls = document.createElement('div');
            propControls.className = 'flex items-center gap-2 flex-wrap';
            propControls.innerHTML = `
              <!-- Modo 1: Versão Final Decidida -->
              <div id="top-bar-mode-final" class="flex items-center bg-slate-800/95 p-1 rounded-lg border border-emerald-500/40 gap-2 flex-wrap">
                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-[11px] font-bold">
                  <span>✅ Decisão Oficial:</span>
                  <strong class="text-white">⭐ 3. Parcela (3x s/ juros) + Alcance</strong>
                </span>
                <button type="button" onclick="setProtoViewMode('simulador')" class="px-2.5 py-1 text-[11px] font-semibold rounded-md bg-slate-700 hover:bg-slate-600 text-slate-200 transition cursor-pointer">
                  🧪 Explorar Simulador (7 Opções)
                </button>
              </div>

              <!-- Modo 2: Simulador Completo (7 Opções da Proposta Executiva) -->
              <div id="top-bar-mode-simulador" class="hidden items-center bg-slate-800 p-1 rounded-lg border border-slate-700 gap-1 flex-wrap">
                <button type="button" onclick="setProtoViewMode('final')" class="px-2 py-1 text-[11px] font-bold rounded-md bg-emerald-600 hover:bg-emerald-500 text-white transition cursor-pointer mr-1" title="Voltar para a Versão Final Decidida">
                  ✅ Versão Final
                </button>
                <button type="button" onclick="selectProposal(0)" data-prop="0" class="prop-btn px-2 py-1 text-[11px] font-semibold rounded-md transition-all text-slate-300 hover:text-white cursor-pointer">0. Atual</button>
                <button type="button" onclick="selectProposal(1)" data-prop="1" class="prop-btn px-2 py-1 text-[11px] font-semibold rounded-md transition-all text-slate-300 hover:text-white cursor-pointer">1. Só Alcance</button>
                <button type="button" onclick="selectProposal(2)" data-prop="2" class="prop-btn px-2 py-1 text-[11px] font-semibold rounded-md transition-all text-slate-300 hover:text-white cursor-pointer">2. Só 3x</button>
                <button type="button" onclick="selectProposal(3)" data-prop="3" class="prop-btn px-2.5 py-1 text-[11px] font-bold rounded-md transition-all bg-[#FA4800] text-white shadow-sm cursor-pointer">⭐ 3. Parcela 3x + Alcance (Decidida)</button>
                <button type="button" onclick="selectProposal(4)" data-prop="4" class="prop-btn px-2 py-1 text-[11px] font-semibold rounded-md transition-all text-slate-300 hover:text-white cursor-pointer">4. Só Valor/Dia</button>
                <button type="button" onclick="selectProposal(5)" data-prop="5" class="prop-btn px-2 py-1 text-[11px] font-semibold rounded-md transition-all text-slate-300 hover:text-white cursor-pointer">🔥 5. Valor/Dia + Alcance</button>
                <button type="button" onclick="selectProposal(6)" data-prop="6" class="prop-btn px-2 py-1 text-[11px] font-semibold rounded-md transition-all text-slate-300 hover:text-white cursor-pointer">💎 6. Completa</button>
              </div>
            `;
            topBarRight.insertBefore(propControls, topBarRight.firstChild);
          }

          window.setProtoViewMode(window.currentViewMode);
        }
      }
    });
  </script>
</body>
</html>
