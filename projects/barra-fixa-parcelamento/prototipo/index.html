<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Protótipo — Melhorias na Barra Fixa (Página de Resultados)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="aqui_ads_official.css" />
  <style>
    /* Tokens Oficiais Aqui Ads Design System (codebase/smb-web/tailwind.config.cjs) */
    /* primary.default: #FF4F00 | primary.dark: #E54700 | neutral.light6: #FFF4EF | border: #FEDDC7 */
    /* type-dark-main: #282E38 | type-dark-secondary: #64748B | neutral.light8: #DFE7EF | neutral.light1: #F9F9FD */

    /* 1. Pílula de Parcelamento Sem Juros (DS Primary Tint) */
    .installment-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #FFF4EF;
      border: 1px solid #FEDDC7;
      color: #FF4F00;
      padding: 5px 12px;
      border-radius: 8px;
      font-family: 'Rethink Sans', sans-serif;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    /* 2. Pílula de Alcance & Impressões Estimadas (DS Neutral Surface) */
    .metric-bubble-group {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #F9F9FD;
      border: 1px solid #DFE7EF;
      padding: 6px 14px;
      border-radius: 8px;
      font-family: 'Rethink Sans', sans-serif;
      font-size: 12px;
      color: #282E38;
      white-space: nowrap;
    }

    /* 3. Container Unificado DS: 1º Parcelamento (3x) + 2º Alcance */
    .combo-pill-container {
      display: inline-flex;
      align-items: center;
      background: #F9F9FD;
      border: 1px solid #DFE7EF;
      border-radius: 8px;
      padding: 4px 14px 4px 5px;
      gap: 12px;
      font-family: 'Rethink Sans', sans-serif;
      white-space: nowrap;
    }

    /* 5. Container Valor por Dia + Alcance (Simulador) */
    .combo-daily-container {
      display: inline-flex;
      align-items: center;
      background: #F9F9FD;
      border: 1px solid #DFE7EF;
      border-radius: 8px;
      padding: 4px 14px 4px 5px;
      gap: 12px;
      font-family: 'Rethink Sans', sans-serif;
      white-space: nowrap;
    }
    .daily-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #F4FCF7;
      border: 1px solid #A7F3D0;
      color: #007800;
      padding: 5px 12px;
      border-radius: 8px;
      font-family: 'Rethink Sans', sans-serif;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .combo-badge-juros {
      background: #FF4F00;
      color: #FFFFFF;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 6px;
      text-transform: lowercase;
      letter-spacing: 0.01em;
    }

    .combo-badge-daily {
      background: #11BC55;
      color: #FFFFFF;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 6px;
      letter-spacing: 0.01em;
    }
  </style>
</head>
<body class="bg-slate-50">
  <!-- Ponto de Montagem do App Shell & Jornada Unificada (aqui_ads_ui.js) -->
  <div id="aqui-ads-app"></div>

  <script src="aqui_ads_mock_data.js?v=2"></script>
  <script>
    window.AQUI_ADS_MANUAL_MOUNT = true;
  </script>
  <script src="aqui_ads_ui.js?v=2"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    window.currentViewMode = urlParams.get('mode') === 'simulador' ? 'simulador' : 'final';
    window.currentProposal = 3; // ⭐ 3. Parcela (3x) + Alcance (Decisão Oficial)
    window.__aquiCartState = null;

    window.setProtoViewMode = function(mode) {
      window.currentViewMode = mode === 'simulador' ? 'simulador' : 'final';
      if (window.currentViewMode === 'final') {
        window.currentProposal = 3;
      }
      const finalBanner = document.getElementById('top-bar-mode-final');
      const simBanner = document.getElementById('top-bar-mode-simulador');
      if (finalBanner && simBanner) {
        if (window.currentViewMode === 'final') {
          finalBanner.classList.remove('hidden');
          finalBanner.classList.add('flex');
          simBanner.classList.add('hidden');
          simBanner.classList.remove('flex');
        } else {
          finalBanner.classList.add('hidden');
          finalBanner.classList.remove('flex');
          simBanner.classList.remove('hidden');
          simBanner.classList.add('flex');
        }
      }
      window.selectProposal(window.currentProposal);
    };

    window.selectProposal = function(num) {
      window.currentProposal = num;
      document.querySelectorAll('.prop-btn').forEach(btn => {
        const btnNum = parseInt(btn.getAttribute('data-prop'), 10);
        const isSelected = btnNum === num;
        if (isSelected) {
          btn.className = 'prop-btn px-2.5 py-1 text-[11px] font-bold rounded-md transition-all bg-[#FF4F00] text-white shadow-sm cursor-pointer';
        } else {
          btn.className = 'prop-btn px-2.5 py-1 text-[11px] font-semibold rounded-md transition-all text-slate-300 hover:text-white hover:bg-slate-700/60 cursor-pointer';
        }
      });
      window.renderCustomStickyBar();
    };

    window.ensureCustomStickyBarStructure = function() {
      const bar = document.getElementById('actions-bar-results');
      if (!bar) return null;
      if (!document.getElementById('deskCentralSlot')) {
        bar.className = 'sticky bottom-0 left-0 right-0 w-full z-30 border-t border-[#DFE7EF] bg-white shadow-[0_-4px_16px_rgba(0,0,0,0.06)] flex flex-col transition-all duration-200';
        bar.innerHTML = `
          <div id="plp-mobile-context-strip" class="hidden w-full"></div>
          <div class="max-w-[1660px] w-full mx-auto px-6 lg:px-10 py-3 flex items-center justify-between gap-4">
            <div id="plp-bar-summary-left" class="flex flex-col text-left shrink-0">
              <p id="plp-bar-count-label" class="text-[11px] font-medium text-[#64748B]">3 produtos selecionados</p>
              <p class="text-xs font-bold text-[#282E38]">Total <span id="plp-bar-total" class="text-sm font-black text-[#282E38] ml-1">R$ 794,88</span></p>
              <div id="plp-bar-sub-left" class="hidden text-[11px] font-bold mt-0.5"></div>
            </div>
            <div id="deskCentralSlot" class="flex items-center justify-center flex-1 px-4"></div>
            <div class="flex items-center gap-2 shrink-0 ml-auto">
              <button id="resultpage_next-button" type="button" onclick="showScreen('view-resumo')" class="bg-[#FF4F00] hover:bg-[#E54700] text-white px-6 py-2.5 rounded-lg font-bold text-xs flex items-center gap-2 transition shadow-xs cursor-pointer">
                <span id="plp-next-btn-label">avançar</span>
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
              </button>
            </div>
          </div>
        `;
      }
      return bar;
    };

    window.renderCustomStickyBar = function(ctx) {
      const bar = window.ensureCustomStickyBarStructure();
      if (!bar) return;

      if (ctx && ctx.cartState) {
        window.__aquiCartState = ctx.cartState;
      }

      const isMobile = document.getElementById('viewport-container')?.classList.contains('mobile-frame');
      let cs = (ctx && ctx.cartState) || window.__aquiCartState || window.cartState;
      if (!cs && window.AquiAdsUI && typeof window.AquiAdsUI.getState === 'function') {
        try {
          const state = window.AquiAdsUI.getState();
          if (state && state.cartState) cs = state.cartState;
        } catch (err) {
          // Fallback caso getState() tenha referência legada em cache
        }
      }
      if (!cs) {
        cs = { oohItems: [], digitalItems: [], durationDays: 14 };
      }
      window.__aquiCartState = cs;

      const oohItems = Array.isArray(cs.oohItems) ? cs.oohItems : [];
      const digitalItems = Array.isArray(cs.digitalItems) ? cs.digitalItems : [];
      const count = oohItems.length + digitalItems.length;
      const campaignDays = cs.durationDays === 28 ? 28 : 14;
      const mult = campaignDays === 28 ? 1.85 : 1;

      const oohTotal = oohItems.reduce((acc, item) => acc + ((Number(item.basePrice2w ?? item.price2w) || 0) * mult), 0);
      const digTotal = digitalItems.reduce((acc, item) => acc + (Number(item.budget) || 0), 0);
      const subtotal = oohTotal + digTotal + (Number(cs.creativeServiceFee) || 0);
      const totalValue = Math.max(0, subtotal - (Number(cs.discountAmount) || 0));

      const summaryLeftEl = document.getElementById('plp-bar-summary-left');
      const deskSlot = document.getElementById('deskCentralSlot');
      const mobStrip = document.getElementById('plp-mobile-context-strip');
      const subLeft = document.getElementById('plp-bar-sub-left');
      const nextBtnEl = document.getElementById('resultpage_next-button');
      const nextBtnLabel = document.getElementById('plp-next-btn-label');
      const badgeEl = document.getElementById('hdr-cart-badge');

      bar.style.display = 'flex';

      if (count <= 0 || totalValue <= 0) {
        if (summaryLeftEl) summaryLeftEl.classList.add('hidden');
        if (deskSlot) deskSlot.className = 'hidden';
        if (mobStrip) mobStrip.className = 'hidden w-full';
        if (subLeft) subLeft.className = 'hidden';
        if (nextBtnEl) {
          nextBtnEl.className = 'bg-[#E2E8F0] text-[#94A3B8] cursor-not-allowed pointer-events-none ml-auto px-6 py-2.5 rounded-lg font-bold text-xs flex items-center gap-2';
        }
        if (badgeEl) {
          badgeEl.textContent = '0';
          badgeEl.classList.add('hidden');
        }
        return;
      }

      if (summaryLeftEl) summaryLeftEl.classList.remove('hidden');
      if (nextBtnEl) {
        nextBtnEl.className = 'bg-[#FF4F00] hover:bg-[#E54700] text-white px-6 py-2.5 rounded-lg font-bold text-xs flex items-center gap-2 transition shadow-xs cursor-pointer';
      }
      if (badgeEl) {
        badgeEl.textContent = String(count);
        badgeEl.classList.remove('hidden');
      }

      const countLabelEl = document.getElementById('plp-bar-count-label');
      const totalEl = document.getElementById('plp-bar-total');
      if (countLabelEl) {
        countLabelEl.textContent = `${count} ${count === 1 ? 'produto selecionado' : 'produtos selecionados'}`;
      }
      if (totalEl) {
        totalEl.textContent = totalValue.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
      }

      const prop = window.currentProposal ?? 3;
      const installmentVal = (totalValue / 3).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
      const dailyTotalVal = (totalValue / campaignDays).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
      const dailyPerScreenVal = (totalValue / campaignDays / Math.max(count, 1)).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

      const impMult = campaignDays === 28 ? 2 : 1;
      let totalImpressions = oohItems.reduce((acc, item) => acc + ((Number(item.impressions ?? item.views2w) || 16200) * impMult), 0);
      if (totalImpressions === 0 && digitalItems.length > 0) {
        totalImpressions = digitalItems.reduce((acc, item) => acc + (Number(item.estimatedViews) || 45000), 0);
      }
      const formattedImpressions = totalImpressions >= 1000
        ? `+${(totalImpressions / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 })} mil`
        : `+${totalImpressions}`;

      if (!deskSlot || !mobStrip || !subLeft) return;

      deskSlot.className = isMobile ? 'hidden' : 'flex items-center justify-center flex-1 px-4';
      mobStrip.className = 'hidden w-full';
      subLeft.className = 'hidden text-[11px] font-bold mt-0.5';
      if (nextBtnLabel) nextBtnLabel.textContent = 'avançar';

      if (prop === 0) {
        // 0. Atual (Produção)
        deskSlot.className = 'hidden';
      } else if (prop === 1) {
        // 1. Só Alcance
        deskSlot.innerHTML = `
          <div class="metric-bubble-group">
            <span class="flex items-center gap-1.5 font-semibold text-[#64748B]">
              <svg class="w-4 h-4 text-[#FF4F00]" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              <span>Alcance estimado: <strong class="text-[#282E38] font-bold">${formattedImpressions}</strong> impressões</span>
            </span>
          </div>
        `;
        if (isMobile) {
          deskSlot.className = 'hidden';
          mobStrip.className = 'flex items-center justify-start px-4 py-1.5 bg-[#F9F9FD] border-b border-[#DFE7EF] text-[11px] text-[#64748B] font-medium';
          mobStrip.innerHTML = `
            <span class="flex items-center gap-1.5">
              <svg class="w-3.5 h-3.5 text-[#FF4F00]" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              <span>Alcance estimado: <strong class="text-[#282E38] font-bold">${formattedImpressions}</strong> impressões</span>
            </span>
          `;
        }
      } else if (prop === 2) {
        // 2. Só Parcelamento (3x)
        deskSlot.innerHTML = `
          <div class="installment-pill">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
            <span>em até <strong>3x de ${installmentVal}</strong></span>
            <span class="combo-badge-juros">sem juros</span>
          </div>
        `;
        if (isMobile) {
          deskSlot.className = 'hidden';
          subLeft.className = 'flex items-center gap-1 text-[11px] font-bold text-[#FF4F00] mt-0.5';
          subLeft.innerHTML = `
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
            <span>em até 3x de ${installmentVal} sem juros</span>
          `;
        }
      } else if (prop === 3) {
        // ⭐ 3. Parcela (3x) + Alcance — VERSÃO FINAL DECIDIDA (1º Parcelamento | 2º Alcance | Sem qtd de telas | 100% DS)
        deskSlot.innerHTML = `
          <div class="combo-pill-container">
            <div class="installment-pill !py-1 !px-3">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
              <span>Até <strong>3x de ${installmentVal}</strong></span>
              <span class="combo-badge-juros">sem juros</span>
            </div>
            <span class="flex items-center gap-1.5 text-xs font-medium text-[#64748B]" title="Estimativa de impressões totais dos produtos selecionados">
              <svg class="w-4 h-4 text-[#FF4F00] shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              <span>Alcance estimado: <strong class="text-[#282E38] font-bold">${formattedImpressions}</strong> impressões</span>
            </span>
          </div>
        `;
        if (isMobile) {
          deskSlot.className = 'hidden';
          subLeft.className = 'flex items-center gap-1 text-[11px] font-bold text-[#FF4F00] mt-0.5';
          subLeft.innerHTML = `
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
            <span>em até 3x de ${installmentVal} sem juros</span>
          `;
          mobStrip.className = 'flex items-center justify-start px-4 py-1.5 bg-[#F9F9FD] border-b border-[#DFE7EF] text-[11px] text-[#64748B] font-medium';
          mobStrip.innerHTML = `
            <span class="flex items-center gap-1.5">
              <svg class="w-3.5 h-3.5 text-[#FF4F00]" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              <span>Alcance estimado: <strong class="text-[#282E38] font-bold">${formattedImpressions}</strong> impressões</span>
            </span>
          `;
        }
      } else if (prop === 4) {
        // 4. Só Valor por Dia
        deskSlot.innerHTML = `
          <div class="daily-pill">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span>Investimento diário: <strong>${dailyTotalVal} / dia</strong> (Período: ${campaignDays} dias)</span>
          </div>
        `;
        if (isMobile) {
          deskSlot.className = 'hidden';
          subLeft.className = 'flex items-center gap-1 text-[11px] font-bold text-[#007800] mt-0.5';
          subLeft.innerHTML = `
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span>Equivalente a ${dailyTotalVal}/dia (${campaignDays} dias)</span>
          `;
        }
      } else if (prop === 5) {
        // 🔥 5. Valor por Dia + Alcance
        deskSlot.innerHTML = `
          <div class="combo-daily-container">
            <div class="daily-pill !py-1 !px-3" title="Equivalente a ${dailyPerScreenVal}/dia por produto selecionado">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              <span>Por dia: <strong>${dailyTotalVal}/dia</strong></span>
              <span class="combo-badge-daily">${dailyPerScreenVal}/ponto</span>
            </div>
            <span class="flex items-center gap-1.5 text-xs font-medium text-[#64748B]" title="Estimativa de impressões totais em ${campaignDays} dias de campanha">
              <svg class="w-4 h-4 text-[#FF4F00] shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              <span>Alcance estimado: <strong class="text-[#282E38] font-bold">${formattedImpressions}</strong> impressões</span>
            </span>
          </div>
        `;
        if (isMobile) {
          deskSlot.className = 'hidden';
          subLeft.className = 'flex items-center gap-1 text-[11px] font-bold text-[#007800] mt-0.5';
          subLeft.innerHTML = `
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span>Por dia: ${dailyTotalVal}/dia (${campaignDays} dias)</span>
          `;
          mobStrip.className = 'flex items-center justify-between px-4 py-1.5 bg-[#F9F9FD] border-b border-[#DFE7EF] text-[11px] text-[#64748B] font-medium';
          mobStrip.innerHTML = `
            <span class="flex items-center gap-1.5">
              <svg class="w-3.5 h-3.5 text-[#FF4F00]" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              <span><strong class="text-[#282E38] font-bold">${formattedImpressions}</strong> impressões</span>
            </span>
            <span class="text-[#007800] font-bold bg-[#F4FCF7] px-2 py-0.5 rounded-md border border-[#A7F3D0]">${dailyPerScreenVal}/dia por ponto</span>
          `;
        }
      } else if (prop === 6) {
        // 💎 6. Visão Completa (3x + Dia + Alcance)
        deskSlot.innerHTML = `
          <div class="combo-pill-container">
            <div class="installment-pill !py-1 !px-2.5 !text-xs">
              <span><strong>Até 3x de ${installmentVal}</strong></span>
              <span class="combo-badge-juros">sem juros</span>
            </div>
            <div class="daily-pill !py-1 !px-2.5 !text-xs">
              <span><strong>${dailyTotalVal}/dia</strong></span>
            </div>
            <span class="flex items-center gap-1.5 text-xs font-medium text-[#64748B]">
              <svg class="w-4 h-4 text-[#FF4F00] shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              <span><strong class="text-[#282E38] font-bold">${formattedImpressions}</strong> impressões</span>
            </span>
          </div>
        `;
        if (isMobile) {
          deskSlot.className = 'hidden';
          subLeft.className = 'flex items-center gap-1 text-[11px] font-bold text-[#FF4F00] mt-0.5';
          subLeft.innerHTML = `<span>em até 3x de ${installmentVal} sem juros</span>`;
          mobStrip.className = 'flex items-center justify-between px-4 py-1.5 bg-[#F9F9FD] border-b border-[#DFE7EF] text-[11px] text-[#64748B] font-medium';
          mobStrip.innerHTML = `
            <span><strong class="text-[#282E38] font-bold">${formattedImpressions}</strong> impressões</span>
            <span class="text-[#007800] font-bold">${dailyTotalVal}/dia</span>
          `;
        }
      }
    };

    AquiAdsUI.mount({
      initialView: 'resultados',
      cartPreset: 'oohOnly',
      hooks: {
        renderBottomBar: function(ctx) {
          window.renderCustomStickyBar(ctx);
        },
        onReady: function() {
          window.ensureCustomStickyBarStructure();

          // Intercepta syncPlpStickyBar e setViewportMode do template v2 para atualizar a barra customizada em tempo real
          const origSync = window.syncPlpStickyBar;
          window.syncPlpStickyBar = function() {
            if (typeof origSync === 'function') origSync();
            window.renderCustomStickyBar();
          };

          const origViewport = window.setViewportMode;
          window.setViewportMode = function(mode) {
            if (typeof origViewport === 'function') origViewport(mode);
            setTimeout(() => window.renderCustomStickyBar(), 20);
          };

          document.addEventListener('click', function(e) {
            if (e.target && e.target.closest && e.target.closest('#plp-cards-grid, #plp-ooh-map-pins, #plp-mode-digital, #modal-plp-detail, #plp-ambience-chips')) {
              setTimeout(() => window.renderCustomStickyBar(), 15);
            }
          });

          // Injeta a barra de controle superior com alternância entre Versão Final Decidida (⭐ 3) e Simulador Completo (7 Opções)
          const topBarRight = document.querySelector('#aqui-ads-shell-root > header > div');
          if (topBarRight && !document.getElementById('top-bar-mode-final')) {
            const propControls = document.createElement('div');
            propControls.className = 'flex items-center gap-2 flex-wrap';
            propControls.innerHTML = `
              <!-- Modo 1: Versão Final Decidida -->
              <div id="top-bar-mode-final" class="flex items-center bg-slate-800/95 p-1 rounded-lg border border-emerald-500/40 gap-2 flex-wrap">
                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-[11px] font-bold">
                  <span>✅ Decisão Oficial:</span>
                  <strong class="text-white">⭐ 3. Parcela (3x s/ juros) + Alcance</strong>
                </span>
                <button type="button" onclick="setProtoViewMode('simulador')" class="px-2.5 py-1 text-[11px] font-semibold rounded-md bg-slate-700 hover:bg-slate-600 text-slate-200 transition cursor-pointer">
                  🧪 Explorar Simulador (7 Opções)
                </button>
              </div>

              <!-- Modo 2: Simulador Completo (7 Opções da Proposta Executiva) -->
              <div id="top-bar-mode-simulador" class="hidden items-center bg-slate-800 p-1 rounded-lg border border-slate-700 gap-1 flex-wrap">
                <button type="button" onclick="setProtoViewMode('final')" class="px-2 py-1 text-[11px] font-bold rounded-md bg-emerald-600 hover:bg-emerald-500 text-white transition cursor-pointer mr-1" title="Voltar para a Versão Final Decidida">
                  ✅ Versão Final
                </button>
                <button type="button" onclick="selectProposal(0)" data-prop="0" class="prop-btn px-2 py-1 text-[11px] font-semibold rounded-md transition-all text-slate-300 hover:text-white cursor-pointer">0. Atual</button>
                <button type="button" onclick="selectProposal(1)" data-prop="1" class="prop-btn px-2 py-1 text-[11px] font-semibold rounded-md transition-all text-slate-300 hover:text-white cursor-pointer">1. Só Alcance</button>
                <button type="button" onclick="selectProposal(2)" data-prop="2" class="prop-btn px-2 py-1 text-[11px] font-semibold rounded-md transition-all text-slate-300 hover:text-white cursor-pointer">2. Só 3x</button>
                <button type="button" onclick="selectProposal(3)" data-prop="3" class="prop-btn px-2.5 py-1 text-[11px] font-bold rounded-md transition-all bg-[#FF4F00] text-white shadow-sm cursor-pointer">⭐ 3. Parcela 3x + Alcance (Decidida)</button>
                <button type="button" onclick="selectProposal(4)" data-prop="4" class="prop-btn px-2 py-1 text-[11px] font-semibold rounded-md transition-all text-slate-300 hover:text-white cursor-pointer">4. Só Valor/Dia</button>
                <button type="button" onclick="selectProposal(5)" data-prop="5" class="prop-btn px-2 py-1 text-[11px] font-semibold rounded-md transition-all text-slate-300 hover:text-white cursor-pointer">🔥 5. Valor/Dia + Alcance</button>
                <button type="button" onclick="selectProposal(6)" data-prop="6" class="prop-btn px-2 py-1 text-[11px] font-semibold rounded-md transition-all text-slate-300 hover:text-white cursor-pointer">💎 6. Completa</button>
              </div>
            `;
            topBarRight.insertBefore(propControls, topBarRight.firstChild);
          }

          window.setProtoViewMode(window.currentViewMode);
        }
      }
    });
  </script>
</body>
</html>
