<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aqui ads — Teste A/B/C/D: Preço por Dia nos Cards da Página de Resultados OOH</title>
  <link rel="icon" href="https://aqui.globo/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
  <!-- CSS Oficial Compilado do Aqui Ads (codebase/smb-web + Espelho de Produção) -->
  <link rel="stylesheet" href="aqui_ads_official.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-white text-gray-900 antialiased min-h-screen flex flex-col">

  <!-- Base de Dados Mockada Oficial Centralizada -->
  <script src="aqui_ads_mock_data.js"></script>

  <!-- Lógica Customizada das Variantes A/B/C/D de Preço por Dia nos Cards OOH -->
  <script>
    let currentPriceVariant = 'B';

    function getOohCardPriceHtml(itemPrice, periodLabel) {
      const days = (typeof cartState !== 'undefined' && cartState.durationDays === 28) ? 28 : 14;
      const dailyPrice = itemPrice / days;

      if (currentPriceVariant === 'B') {
        return `
          <div class="mt-[26px] min-h-[42px] mb-1">
            <div class="flex items-baseline gap-1">
              <strong class="text-2xl font-extrabold leading-6 text-[#0c0a09]">${formatBRL(itemPrice)}</strong>
              <span class="text-base font-normal text-[#8c97a6]">/ ${periodLabel}</span>
            </div>
            <div class="mt-1 flex items-center gap-1.5">
              <span class="text-[11.5px] font-semibold text-[#007800]">equivale a ${formatBRL(dailyPrice)} / dia</span>
            </div>
          </div>
        `;
      }

      if (currentPriceVariant === 'C') {
        return `
          <div class="mt-[26px] min-h-[42px] mb-1">
            <div class="flex items-baseline gap-1">
              <strong class="text-2xl font-extrabold leading-6 text-[#0c0a09]">${formatBRL(dailyPrice)}</strong>
              <span class="text-base font-semibold text-[#5f6b7a]">/ dia</span>
            </div>
            <div class="mt-1 text-[11.5px] font-normal text-[#8c97a6]">
              Total: <strong class="font-semibold text-[#5f6b7a]">${formatBRL(itemPrice)}</strong> por ${periodLabel}
            </div>
          </div>
        `;
      }

      if (currentPriceVariant === 'D') {
        return `
          <div class="mt-[20px] min-h-[48px] mb-1">
            <div class="mb-1.5">
              <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[11px] font-bold bg-[#F0FDF4] text-[#15803D] border border-[#BBF7D0]">
                ⚡ Apenas ${formatBRL(dailyPrice)}/dia
              </span>
            </div>
            <div class="flex items-baseline gap-1">
              <strong class="text-2xl font-extrabold leading-6 text-[#0c0a09]">${formatBRL(itemPrice)}</strong>
              <span class="text-base font-normal text-[#8c97a6]">/ ${periodLabel}</span>
            </div>
          </div>
        `;
      }

      // Variante A (Controle Oficial)
      return `
        <div class="mt-[38px] flex items-baseline gap-1 min-h-[28px] mb-1">
          <strong class="text-2xl font-extrabold leading-6 text-[#0c0a09]">${formatBRL(itemPrice)}</strong>
          <span class="text-base font-normal text-[#8c97a6]">/ ${periodLabel}</span>
        </div>
      `;
    }

    function setPriceVariant(variant) {
      currentPriceVariant = variant;
      ['A', 'B', 'C', 'D'].forEach(v => {
        const btn = document.getElementById('variant-btn-' + v);
        if (!btn) return;
        if (v === variant) {
          btn.className = 'px-2.5 py-1 rounded-md text-[11px] font-bold bg-[#FF5A00] text-white transition cursor-pointer shadow-2xs';
        } else {
          btn.className = 'px-2.5 py-1 rounded-md text-[11px] font-bold text-gray-400 hover:text-white transition cursor-pointer';
        }
      });
      renderOohPlp();
      const labels = {
        A: 'Variante A (Controle Oficial: Preço por período)',
        B: 'Variante B (Preço do período + Subtítulo por dia)',
        C: 'Variante C (Hero Preço por dia + Total abaixo)',
        D: 'Variante D (Badge de Preço por dia + Preço do período)'
      };
      showToast(labels[variant] || ('Variante ' + variant));
    }

    window.AQUI_ADS_CONFIG = {
      initialScreen: 'view-resultados',
      initialChannel: 'ooh',
      cartPreset: 'empty',
      hooks: {
        renderOohCard(item, ctx, defaultRender) {
          const baseHtml = defaultRender(item);
          const defaultPriceBlockRegex = /<div class="mt-\[38px\] flex items-baseline gap-1 min-h-\[28px\] mb-1">[\s\S]*?<\/div>/;
          return baseHtml.replace(defaultPriceBlockRegex, getOohCardPriceHtml(ctx.itemPrice, ctx.periodLabel));
        },
        onReady() {
          const topbarRow = document.querySelector('#aqui-ads-shell-root > header > div');
          if (topbarRow && !document.getElementById('variant-btn-A')) {
            topbarRow.insertAdjacentHTML('beforeend', `
              <div class="flex flex-wrap items-center gap-2">
                <span class="text-[11px] font-semibold text-gray-400">Teste A/B/C/D (Cards OOH):</span>
                <div class="flex flex-wrap items-center bg-gray-900 p-0.5 rounded-lg border border-gray-800 gap-0.5">
                  <button onclick="setPriceVariant('A')" id="variant-btn-A" class="px-2.5 py-1 rounded-md text-[11px] font-bold text-gray-400 hover:text-white transition cursor-pointer">
                    Controle A (Atual)
                  </button>
                  <button onclick="setPriceVariant('B')" id="variant-btn-B" class="px-2.5 py-1 rounded-md text-[11px] font-bold bg-[#FF5A00] text-white transition cursor-pointer shadow-2xs">
                    Variante B (Subtítulo +/dia)
                  </button>
                  <button onclick="setPriceVariant('C')" id="variant-btn-C" class="px-2.5 py-1 rounded-md text-[11px] font-bold text-gray-400 hover:text-white transition cursor-pointer">
                    Variante C (Hero /dia)
                  </button>
                  <button onclick="setPriceVariant('D')" id="variant-btn-D" class="px-2.5 py-1 rounded-md text-[11px] font-bold text-gray-400 hover:text-white transition cursor-pointer">
                    Variante D (Badge /dia)
                  </button>
                </div>
                <a href="https://app.notion.com/p/Test-Card-Pre-o-por-Dia-nos-Cards-da-P-gina-de-Resultados-OOH-3ff9587e4137819b8de7eb645face07c" target="_blank" rel="noopener noreferrer" class="px-2.5 py-1 rounded-lg text-[11px] font-bold bg-indigo-950/90 hover:bg-indigo-900 text-indigo-200 border border-indigo-700/70 flex items-center gap-1 transition cursor-pointer">
                  <span>📄</span> <span>Doc Notion</span> <span class="text-[10px] opacity-75">↗</span>
                </a>
              </div>
            `);
          }
          renderOohPlp();
        }
      }
    };
  </script>

  <!-- Motor de UI e Jornada Oficial do Aqui Ads -->
  <script src="aqui_ads_ui.js"></script>
</body>
</html>
